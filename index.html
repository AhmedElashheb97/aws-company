<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS COMPANY</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#FBF6F1; --surface:#FFFFFF; --surface-2:#FFF8F2;
  --ink:#120A04; --muted:#4A3A2D; --line:#E2D2C3; --line-2:#EDE1D5;
  --brand:#E8701A; --brand-d:#C2570C; --brand-soft:#FFEEDF; --brand-softer:#FFF6EE;
  --ok:#2F855A; --ok-soft:#E6F4EC; --bad:#C53030; --bad-soft:#FDECEC;
  --info:#2B6CB0; --info-soft:#E8F1FB; --warn:#A8650B; --warn-soft:#FFF4DC;
  --radius:12px; --shadow:0 1px 2px rgba(80,40,10,.06),0 4px 14px rgba(80,40,10,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;font-size:14.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

/* side menu */
:root{--side:250px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo img{height:36px;width:auto;display:block}
#login .logo img{height:64px}
.pubh .logo img{height:70px}
#side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--side);background:var(--surface);border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;gap:14px;padding:18px 14px;z-index:20;overflow-y:auto}
#side .brand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0 10px;border-bottom:1px solid var(--line-2)}
#side .brand img{height:52px;width:auto}
#side .brand span{font-weight:800;font-size:15px;letter-spacing:.3px}
#side .newcar{width:100%;justify-content:center;padding:11px 14px;border-radius:12px;box-shadow:0 4px 12px rgba(232,112,26,.28)}
#nav{display:flex;flex-direction:column;gap:4px}
#nav a,.sbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:700;cursor:pointer;
  border:0;background:transparent;width:100%;text-align:start;transition:background .15s,color .15s}
#nav a .ic,.sbtn .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#F6EEE6;color:#7A5A40;flex:none;transition:background .15s,color .15s}
#nav a svg,.sbtn svg{width:19px;height:19px}
#nav a:hover,.sbtn:hover{background:var(--brand-softer);color:var(--ink)}
#nav a.on{background:linear-gradient(160deg,#FFF1E4,#FFE4CC);color:#A2440A}
#nav a.on .ic{background:var(--brand);color:#fff;box-shadow:0 4px 10px rgba(232,112,26,.35)}
#nav a .ext{margin-inline-start:auto;opacity:.5;width:14px;height:14px}
#side .navlbl{font-size:12px;font-weight:700;color:var(--muted);padding:0 12px;letter-spacing:.3px}
#side .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line-2);padding-top:10px}
#cloud .em{display:block;font-size:12.5px;color:var(--muted);padding:2px 12px 6px;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.sbtn.out{color:var(--bad)} .sbtn.out .ic{background:var(--bad-soft);color:var(--bad)}
main{max-width:1320px;margin-inline-start:var(--side);padding:24px 28px 60px}
@media (max-width:900px){
  #side{position:sticky;inset:auto;top:0;width:auto;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 10px;border-inline-end:0;border-bottom:1px solid var(--line);overflow:visible}
  #side .brand{border:0;padding:0;flex-direction:row}
  #side .brand img{height:30px} #side .brand span,#side .navlbl,#cloud .em{display:none}
  #nav{position:fixed;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;gap:0;background:var(--surface);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(80,40,10,.06);z-index:30}
  #nav a{flex-direction:column;gap:3px;padding:2px 4px;font-size:11.5px;width:auto;flex:1;align-items:center;white-space:nowrap;background:transparent !important}
  #nav a .ic{width:40px;height:30px;border-radius:99px;background:transparent} #nav a .ext{display:none}
  .sbtn{width:auto;padding:4px;font-size:0;gap:0} .sbtn .ic{width:36px;height:36px}
  #side .foot{margin:0 0 0 auto;flex-direction:row;border:0;padding:0;gap:2px;margin-inline-start:auto}
  #cloud{display:flex}
  #side .newcar{width:auto;padding:9px 14px;box-shadow:none}
  main{margin:0;padding:16px 12px 90px}
  #toast{bottom:84px}
}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--brand-softer);border-color:#F2CFAF}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--brand-softer)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:#F3C2C2}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* cards & layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi.hl{background:linear-gradient(160deg,#FFF3E8,#FFE6D1);border-color:#F6D2B2}
.kpi.hl .v{color:var(--brand-d)}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--brand)}
.kpi.sel{outline:2px solid var(--brand);outline-offset:-1px}

/* badges */
.bdg{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.bdg.buy{background:var(--warn-soft);color:var(--warn)}
.bdg.ship{background:var(--info-soft);color:var(--info)}
.bdg.done{background:var(--ok-soft);color:var(--ok)}
.bdg.loc{background:var(--brand-soft);color:var(--brand-d)}
.bdg.exp{background:#F3EEE9;color:var(--muted)}
.bdg.recv{background:var(--ok-soft);color:var(--ok)}
.bdg.bad{background:var(--bad-soft);color:var(--bad)}

/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:700;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--brand-softer)}
.tblwrap{overflow-x:auto}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* toolbar */
.tabs{display:inline-flex;background:#F4EBE2;border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--brand-d);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;width:100%;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,112,26,.15)}
.search{max-width:300px}

/* car detail */
.chead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 20px}
.info .l{font-size:12px;color:var(--muted);font-weight:600}
.info .v{font-weight:600;word-break:break-word}
.steps{display:flex;gap:0;overflow-x:auto;padding:4px 0}
.step{flex:1;min-width:92px;text-align:center;cursor:pointer;position:relative;padding-top:30px;font-size:12.5px;font-weight:600;color:var(--muted)}
.step::before{content:"";position:absolute;top:11px;left:50%;width:100%;height:3px;background:var(--line)}
.step:first-child::before{display:none}
.step .dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:21px;height:21px;border-radius:50%;background:var(--surface);border:3px solid var(--line);z-index:1}
.step.past .dot,.step.cur .dot{background:var(--brand);border-color:var(--brand)}
.step.past::before,.step.cur::before{background:var(--brand)}
.step.cur{color:var(--brand-d)}
.step.cur .dot{box-shadow:0 0 0 4px rgba(232,112,26,.2)}
.step:hover{color:var(--ink)}
.fin{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fin .s{padding:5px 14px;border-radius:99px;background:#F3EEE9;color:var(--muted);font-weight:700;font-size:13px}
.fin .s.on{background:var(--brand);color:#fff}
.fin .s.ok{background:var(--ok-soft);color:var(--ok)}
.fin .arr{color:#C9B6A5}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
.stage{overflow:hidden}
.stage .top{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.stage.current .top{background:linear-gradient(160deg,#FFF1E4,#FFE7D3)}
.stage.current{border-color:#F3C9A3}
.stage .n{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.stage.dim .n{background:#D8C8BA}
.stage .body{padding:12px 18px 16px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.ln.sub{color:var(--muted);font-size:13px;padding-right:12px}
.ln.tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:9px;font-weight:700}
.ln.rem{font-size:17px;font-weight:700}
.ln.rem.zero{color:var(--ok)}
.ln.rem.due{color:var(--bad)}
.sec{font-size:12px;font-weight:700;color:var(--brand-d);margin:12px 0 2px;letter-spacing:.2px}
.profit{margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--brand-softer);border:1px solid #F6DEC8}
.profit.recv{background:var(--ok-soft);border-color:#C7E6D3}
.profit .pv{font-size:19px;font-weight:700}
.profit.loss{background:var(--bad-soft);border-color:#F3C2C2}
.ppos{color:var(--ok)} .pneg{color:var(--bad)}
.vinln{margin-top:3px;letter-spacing:.4px}
td.num{display:table-cell}   /* .num is inline-block; on a table cell that breaks the row background */
.pcell{white-space:nowrap}
.ptot{font-size:18px;font-weight:800;line-height:1.2}
.pchips{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:99px;font-size:13.5px;font-weight:700;background:var(--ok-soft);color:#1F6340}
.pchip i{font-style:normal;font-weight:600;font-size:12px;opacity:.75;min-width:26px}
.pchip.pneg{background:var(--bad-soft);color:var(--bad)}
.pchipc{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--pc);vertical-align:-1px}
.gport{margin-bottom:16px;overflow:hidden;border-top:4px solid var(--pc)}
.gph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 12%,#fff),#fff)}
.gst{padding:8px 18px 2px;font-weight:800;color:var(--muted);font-size:14px;border-top:1px solid var(--line-2)}
.gcars{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;padding:8px 18px 14px}
.gcar{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.gcar:hover{border-color:var(--brand);background:var(--brand-softer)}
.gtx{flex:1;min-width:0;line-height:1.5} .gtx b{display:block}
.aflist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
.afrow{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.afrow:has(input:checked){border-color:var(--brand);background:var(--brand-softer)}
.afrow input{accent-color:var(--brand);margin-top:5px;width:17px;height:17px}
b.click{cursor:pointer} b.click:hover{color:var(--brand-d)}
.seg{display:inline-flex;background:#F4EBE2;border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;min-width:46px;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:800;font-size:16px;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(232,112,26,.35)}
.logl{display:flex;flex-direction:column}
.logi{padding:12px 18px;border-bottom:1px solid var(--line-2)}
.logi:last-child{border-bottom:0}
.logh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logh b.click{cursor:pointer} .logh b.click:hover{color:var(--brand-d);text-decoration:underline}
.logi ul{margin:6px 0 0;padding-inline-start:20px;font-size:14.5px;line-height:1.75}
.logi li::marker{color:var(--brand)}
.lold{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.lnew{font-weight:800}
.pwarn{margin-top:5px;font-size:12.5px;font-weight:700;color:#8B1E1E;background:var(--bad-soft);border-radius:8px;padding:2px 8px;display:inline-block}
.paycost{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.kpi .pchips{flex-direction:row;flex-wrap:wrap;margin-top:8px}
.pst{font-size:12.5px;color:var(--muted);margin-top:5px}
.note{padding:10px 13px;border-radius:10px;background:var(--warn-soft);color:#7A4A06;font-size:13px;margin-top:10px}
.note.info{background:var(--info-soft);color:#1E4E80}
.note.bad{background:var(--bad-soft);color:#8B1E1E}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(42,29,19,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;background:var(--surface-2);border-radius:0 0 14px 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f.full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-weight:700;color:var(--brand-d);border-bottom:1px solid var(--line);padding-bottom:5px;margin-top:6px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label{border:2px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.choice label:has(input:checked){border-color:var(--brand);background:var(--brand-softer)}
.choice input{accent-color:var(--brand);margin-top:4px}
.big{border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:var(--surface);text-align:start}
.big:hover{border-color:var(--brand);background:var(--brand-softer)}
.big b{display:block;font-size:16px;margin-bottom:3px}

/* profits */
.bars .br{display:grid;grid-template-columns:90px 1fr 110px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.bars .track{height:12px;background:#F4EBE2;border-radius:99px;overflow:hidden}
.bars .fill{height:100%;background:linear-gradient(90deg,#F59A4A,var(--brand));border-radius:99px}

/* map */
.mapgrid{display:grid;grid-template-columns:1fr 360px;gap:16px}
.map svg{width:100%;height:auto;display:block}
.map path{stroke:#fff;stroke-width:.8;cursor:pointer;transition:opacity .15s}
.map path:hover{opacity:.75}
.map path.sel{stroke:var(--ink);stroke-width:2}
.map text{font-size:9px;fill:#3a2a1d;pointer-events:none;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* car photos */
.carcell{display:flex;align-items:center;gap:10px}
.thumb{width:66px;height:48px;border-radius:8px;object-fit:cover;background:var(--brand-soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
.carinfo{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:var(--brand-soft)}
.gal{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.gal img{width:64px;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;flex:none;border:1px solid var(--line)}
.gal img:hover{outline:2px solid var(--brand)}
.imgprev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgprev img{width:150px;height:104px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--brand-soft)}
.inrow{display:flex;gap:6px;align-items:center}
.inrow .inp{flex:1;min-width:0}
a.lnk{color:var(--brand-d);text-decoration:none;font-weight:600}
a.lnk:hover{text-decoration:underline}
@media (max-width:900px){ .carinfo{grid-template-columns:1fr} }

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
#toast.on{opacity:1}
#print{display:none}
#login{position:fixed;inset:0;z-index:300;background:linear-gradient(160deg,#FFF3E8,#FBF6F1 55%);display:none;align-items:center;justify-content:center;padding:16px}
#login.on{display:flex}
#login .box{width:100%;max-width:380px;padding:28px}
#login .logo{justify-content:center;margin-bottom:6px;font-size:20px}
#login .err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
.xbox{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px}
.xroute:not(:empty){margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--info-soft);color:#1E4E80;font-size:14px;line-height:1.8}
#xRows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 178px 112px 142px 34px;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.xrow.reloc{border-color:#9DC3EA;background:#F5FAFF}
.xrow .inp{padding:7px 9px}
.xinv{grid-column:1/-1;display:flex;gap:6px;align-items:center;color:var(--muted)}
.xtot:not(:empty){margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(232,112,26,0)}30%,70%{box-shadow:0 0 0 5px rgba(232,112,26,.45);border-color:var(--brand)}}
.flash{animation:flash .6s ease 3}
@media (max-width:900px){ .xrow{grid-template-columns:1fr 1fr} .xrow [data-k="desc"]{grid-column:1/-1} }
body.pub #side{display:none}
body.pub main{margin:0 auto}
.pubw{max-width:900px;margin:0 auto}
.pubh{text-align:center;margin:10px 0 16px}

/* readability: bigger, darker text on screen */

  body{font-size:17px}
  .btn.sm{font-size:14.5px}
  h1{font-size:25px} h2{font-size:19px} h3{font-size:17px}
  .small,.tbl th,.f label,.step,.legend{font-size:14px}
  .kpi .l,.ln.sub,.fin .s,.note{font-size:14.5px}
  .kpi .v{font-size:27px}
  .bdg,.info .l,.sec,.hint{font-size:13.5px}

}

  #print h1{color:#C2570C}
}

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===================== data ===================== */
const KEY = 'car_office_v1';
const P = window.AWS_PORTS || {ports:[], yards:[], states:[], markup:{tow:0, ocean_per_car:0}};
const LOC = ['تم الشراء','تم السداد','نقل داخلي','مستودع','في البحر','وصلت','تسلمت'];
const STG = {buy:'شراء', ship:'شحن', done:'مكتملة'};
const STGN = {buy:'المرحلة 1: الشراء', ship:'المرحلة 2: الشحن'};
const METHODS = ['نقدي','حوالة مصرفية','تحويل','صك','أخرى'];
const PORT_COLORS = {SAV:'#F2994A',HOU:'#E9C46A',NYC:'#6FA8DC',CHI:'#A58BD6',LAX:'#7BC47F',SEA:'#5BBFB5',HNL:'#E68AB8'};

let db = load();
let ui = {view:'cars', carId:null, filter:'all', q:'', month:thisMonth(), allMonths:false, drill:'recv', mapState:null};

function load(){
  let d; try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  d = d || {};
  d.cars = d.cars || [];
  d.customers = d.customers || [];
  d.settings = Object.assign({officeName:'AWS COMPANY', officeFee:0, wirePct:1.5, perContainer:4}, d.settings||{});
  return d;
}
/* storage: Firebase (Firestore) when firebase-config.js is filled in, otherwise this browser only */
const FBC = window.FIREBASE_CONFIG || {};
const USE_FB = !!(window.firebase && FBC.apiKey && !/PASTE|ضع/.test(FBC.apiKey));
let fs = null, fbAuth = null, unsub = [];
const plain = o => JSON.parse(JSON.stringify(o));
function fbErr(e){ console.error(e); toast('تعذر الحفظ في السحابة: ' + (e.code || e.message)); }
function save(c){
  if(!USE_FB){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('تعذر الحفظ في المتصفح!'); } return; }
  if(c){ logCar(shadow.cars[c.id], c); fs.collection('cars').doc(c.id).set(plain(c)).catch(fbErr); }
}
function saveSettingsStore(){ if(USE_FB){ logSettings(); fs.collection('meta').doc('settings').set(plain(db.settings)).catch(fbErr); } else save(); }
function removeCar(id){ const old = shadow.cars[id]; db.cars = db.cars.filter(c => c.id !== id); if(USE_FB){ if(old) addLog('car', id, carName(old), 'حذف', [`حذف السيارة${old.vin ? ' — ' + old.vin : ''}${old.customer ? ' — ' + old.customer : ''}`]); fs.collection('cars').doc(id).delete().catch(fbErr); } else save(); }
function saveCust(cu){ if(!USE_FB) return save(); logCust(shadow.customers[cu.id], cu); fs.collection('customers').doc(cu.id).set(plain(cu)).catch(fbErr); }
function saveContainer(ct, changes){
  if(!USE_FB) return save();
  if(changes && changes.length) addLog('container', ct.id, 'حاوية ' + (ct.no || ''), shadow.containers && shadow.containers[ct.id] ? 'تعديل' : 'إضافة', changes);
  fs.collection('containers').doc(ct.id).set(plain(ct)).catch(fbErr);
}
function removeCust(id){ const old = shadow.customers[id]; db.customers = db.customers.filter(x => x.id !== id); if(USE_FB){ if(old) addLog('customer', id, old.name, 'حذف', ['حذف الزبون']); fs.collection('customers').doc(id).delete().catch(fbErr); } else save(); }

/* ---------- change log: who changed what, and when ---------- */
const shadow = {cars:{}, customers:{}, containers:{}, settings:null};   // last copy seen from the cloud, to compare against
const $t = n => '$' + r2(n).toLocaleString('en-US', {maximumFractionDigits:2});
function addLog(kind, ref, title, action, changes){
  if(!USE_FB || !fbAuth || !fbAuth.currentUser || !changes.length) return;
  fs.collection('log').add({at:new Date().toISOString(), by:fbAuth.currentUser.email || '', kind, ref, title:title || '', action, changes}).catch(e => console.error('log', e));
}
const CAR_F = {customer:'الزبون', vin:'رقم الهيكل', year:'السنة', make:'النوع', lot:'رقم اللوت', auction:'المزاد', date:'تاريخ الشراء',
  buyPrice:'سعر الشراء', auctionFees:'رسوم المزاد', officeFee:'عمولة المكتب', wirePct:'عمولة الحوالة %', yard:'الساحة', port:'ميناء الساحة',
  relocPort:'نقل لميناء آخر', perContainer:'سيارات في الحاوية', towCharge:'السحب على الزبون', oceanCharge:'البحري على الزبون',
  shipWirePct:'عمولة حوالة الشحن %', towCost:'السحب الفعلي', oceanCost:'البحري الفعلي', notes:'الملاحظات', img:'الصورة', link:'رابط السيارة',
  loc:'المكان', stage:'المرحلة', lock1:'قفل المرحلة 1', lock2:'قفل المرحلة 2', manualShip:'نقل يدوي للشحن', containerNo:'رقم الحاوية', booking:'رقم الحجز'};
const MONEY_F = new Set(['buyPrice','auctionFees','officeFee','towCharge','oceanCharge','towCost','oceanCost']);
function fmtF(k, v){
  if(v === '' || v == null || v === false) return '—';
  if(k === 'loc') return LOC[v] || v;
  if(k === 'stage') return STG[v] || v;
  if(k === 'yard') return P.yards[v] ? P.yards[v].n + ', ' + P.yards[v].s : v;
  if(k === 'port' || k === 'relocPort') return pName(v);
  if(k === 'img') return 'صورة';
  if(k === 'manualShip') return 'نعم';
  if(MONEY_F.has(k)) return $t(v);
  if(k === 'notes' || k === 'link') return String(v).slice(0, 40) + (String(v).length > 40 ? '…' : '');
  return String(v);
}
const who = p => p === 'office' ? 'على المكتب' : 'على الزبون';
function diffList(a, b, label, describe, fields){
  const out = [], A = new Map((a || []).map(x => [x.id, x])), B = new Map((b || []).map(x => [x.id, x]));
  B.forEach((x, id) => { if(!A.has(id)) out.push(`${label} جديد${label === 'دفعة' ? 'ة' : ''}: ${describe(x)}`); });
  A.forEach((x, id) => { if(!B.has(id)) out.push(`حذف ${label}: ${describe(x)}`); });
  B.forEach((x, id) => { const o = A.get(id); if(!o) return;
    const ch = fields.filter(([f]) => String(o[f] ?? '') !== String(x[f] ?? '')).map(([f, n, fm]) => `${n}: ${fm ? fm(o[f]) : (o[f] || '—')} ← ${fm ? fm(x[f]) : (x[f] || '—')}`);
    if(ch.length) out.push(`تعديل ${label} (${describe(o)}): ${ch.join('، ')}`);
  });
  return out;
}
function logCar(o, c){
  if(!o){ addLog('car', c.id, carName(c), 'إضافة', [`سيارة جديدة${c.vin ? ' — ' + c.vin : ''}${c.customer ? ' — الزبون ' + c.customer : ''}`]); return; }
  const ch = [];
  Object.keys(CAR_F).forEach(k => { if(String(o[k] ?? '') !== String(c[k] ?? '') && !(o[k] == null && (c[k] === '' || c[k] === false)) && !(c[k] == null && (o[k] === '' || o[k] === false)))
    ch.push(`${CAR_F[k]}: ${fmtF(k, o[k])} ← ${fmtF(k, c[k])}`); });
  const ap = x => x ? `${x.by === 'office' ? 'المكتب' : 'الزبون'} ${x.date || ''}` : '—';
  if(JSON.stringify(o.auctionPaid || null) !== JSON.stringify(c.auctionPaid || null)) ch.push(`سداد المزاد: ${ap(o.auctionPaid)} ← ${ap(c.auctionPaid)}`);
  ch.push(...diffList(o.payments, c.payments, 'دفعة', p => `${$t(p.amount)} — ${STG[p.stage] || ''} — ${p.date || ''}`,
    [['amount','المبلغ',$t], ['date','التاريخ'], ['stage','المرحلة',v => STG[v] || v], ['method','الطريقة']]));
  ch.push(...diffList(o.expenses, c.expenses, 'مصروف', e => `${e.desc || 'مصروف'} ${$t(e.amount)} (${who(e.payer)})`,
    [['desc','الوصف'], ['amount','المبلغ',$t], ['payer','على مين',who], ['stage','المرحلة',v => STG[v] || v], ['date','التاريخ']]));
  ch.push(...diffList(o.refunds, c.refunds, 'مبلغ راجع', r => `${$t(r.amount)}${r.returned ? ' (رجع)' : ''}`, [['amount','المبلغ',$t], ['returned','رجع للزبون']]));
  addLog('car', c.id, carName(c), 'تعديل', ch);
}
function logCust(o, cu){
  if(!o){ addLog('customer', cu.id, cu.name, 'إضافة', ['زبون جديد' + (cu.phone ? ' — ' + cu.phone : '')]); return; }
  const F = {name:'الاسم', phone:'الهاتف', phone2:'هاتف ثاني', city:'المدينة', notes:'ملاحظات'};
  addLog('customer', cu.id, cu.name, 'تعديل', Object.keys(F).filter(k => String(o[k] ?? '') !== String(cu[k] ?? '')).map(k => `${F[k]}: ${o[k] || '—'} ← ${cu[k] || '—'}`));
}
function logSettings(){
  const o = shadow.settings || {}, s = db.settings, F = {officeName:'اسم المكتب', officeFee:'عمولة المكتب الافتراضية', wirePct:'عمولة الحوالة الافتراضية %', perContainer:'سيارات في الحاوية'};
  addLog('settings', 'settings', 'الإعدادات', 'تعديل', Object.keys(F).filter(k => String(o[k] ?? '') !== String(s[k] ?? '')).map(k => `${F[k]}: ${o[k] ?? '—'} ← ${s[k] ?? '—'}`));
}
async function replaceAll(d){
  if(!USE_FB){ localStorage.setItem(KEY, JSON.stringify(d)); db = load(); return; }
  const ops = [];
  for(const col of ['cars','customers']){ (await fs.collection(col).get()).forEach(doc => ops.push(b => b.delete(doc.ref))); }
  d.cars.forEach(c => ops.push(b => b.set(fs.collection('cars').doc(c.id), plain(c))));
  (d.customers || []).forEach(cu => ops.push(b => b.set(fs.collection('customers').doc(cu.id), plain(cu))));
  if(d.settings) ops.push(b => b.set(fs.collection('meta').doc('settings'), plain(d.settings)));
  for(let i = 0; i < ops.length; i += 400){ const b = fs.batch(); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); }
}
function setCloud(t){ const el = $('#cloud'); if(el) el.innerHTML = t; }

function initFirebase(){
  firebase.initializeApp(FBC);
  fbAuth = firebase.auth(); fs = firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(() => {});
  db = {cars:[], customers:[], settings:load().settings};
  fbAuth.onAuthStateChanged(user => {
    unsub.forEach(f => f()); unsub = [];
    if(!user){ $('#login').classList.add('on'); setCloud(''); return; }
    $('#login').classList.remove('on');
    setCloud(`<span class="em" title="${esc(user.email)}">${esc(user.email)}</span>
      <button class="sbtn out" onclick="fbAuth.signOut()"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg></span>خروج</button>`);
    let first = true;
    unsub.push(fs.collection('cars').onSnapshot(snap => {
      db.cars = snap.docs.map(d => Object.assign({expenses:[], payments:[], refunds:[]}, d.data()));
      shadow.cars = Object.fromEntries(snap.docs.map(d => [d.id, Object.assign({expenses:[], payments:[], refunds:[]}, d.data())]));
      render();
      clearTimeout(syncTracking._t); syncTracking._t = setTimeout(syncTracking, 1500);
      if(first){ first = false; offerUpload(snap.empty); }
    }, fbErr));
    unsub.push(fs.collection('customers').onSnapshot(snap => { db.customers = snap.docs.map(d => d.data()); shadow.customers = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); render(); }, fbErr));
    unsub.push(fs.collection('meta').doc('settings').onSnapshot(d => { if(d.exists){ db.settings = Object.assign(db.settings, d.data()); shadow.settings = d.data(); render(); } }, fbErr));
    unsub.push(fs.collection('containers').onSnapshot(snap => {
      db.containers = snap.docs.map(d => d.data()); shadow.containers = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); render();
    }, e => console.error('containers', e)));
    unsub.push(fs.collection('log').orderBy('at', 'desc').limit(500).onSnapshot(snap => {
      db.log = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      if(ui.view === 'log' || ui.view === 'car' || ui.view === 'customer') render();
    }, e => console.error('log', e)));
  });
}
function doLogin(){
  const btn = $('#lgBtn'); btn.disabled = true; $('#lgErr').textContent = '';
  fbAuth.signInWithEmailAndPassword($('#lgEmail').value.trim(), $('#lgPass').value)
    .catch(e => { $('#lgErr').textContent = /invalid|wrong|not-found/.test(e.code) ? 'البريد أو كلمة المرور غير صحيحة' : 'تعذر الدخول: ' + e.code; })
    .finally(() => btn.disabled = false);
}
/* first time on Firebase: if this browser still has local data and the cloud is empty, offer to upload it */
function offerUpload(cloudEmpty){
  let local; try{ local = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!cloudEmpty || !local || !local.cars || !local.cars.length) return;
  ask(`فيه ${local.cars.length} سيارة محفوظة في هذا المتصفح من قبل. نرفعهم لـ Firebase؟`, () => {
    replaceAll(local).then(() => { localStorage.removeItem(KEY); toast('تم رفع البيانات للسحابة'); }).catch(fbErr);
  }, 'رفع');
}

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const r2 = n => Math.round(+((+n || 0) * 100).toFixed(6)) / 100;   // toFixed first so 14.475 rounds to 14.48
const N = v => (v === '' || v == null || isNaN(+v)) ? 0 : +v;
function today(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function thisMonth(){ return today().slice(0,7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){
  n = r2(n); const neg = n < 0;
  const s = '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
  return `<span class="num">${neg ? '−' : ''}${s}</span>`;
}
function dt(s){ return `<span class="num">${esc(s)}</span>`; }
function monthName(m){ if(!m) return ''; const [y,mm] = m.split('-'); return new Date(+y, +mm-1, 1).toLocaleDateString('ar-LY-u-nu-latn', {month:'long', year:'numeric'}); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }
function carName(c){ return [c.year, c.make].filter(Boolean).join(' ') || 'سيارة بدون اسم'; }
function getCar(id){ return db.cars.find(c => c.id === id); }
function expLabel(e){ return e.kind === 'fine' ? 'غرامة' : 'مصروف'; }
function getCust(id){ return db.customers.find(x => x.id === id); }
function carThumb(c){ return c.img ? `<img class="thumb" src="${esc(c.img)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;thumb&quot;>🚗</div>'">` : `<div class="thumb">🚗</div>`; }
function portById(id){ return P.ports.find(p => p.id === id); }
function yardLabel(y){ return `${y.n}, ${y.s} — ${y.a}`; }
const YARD_IDX = {}; P.yards.forEach((y,i) => YARD_IDX[yardLabel(y)] = i);

function quote(yi, pid, k){
  const y = P.yards[yi], res = {};
  if(y){ res.towCost = y.tow; res.towCharge = y.tow == null ? null : y.tow + (P.markup.tow||0); }
  const port = portById(pid || (y && y.p));
  if(port && port.ocean[k]){ const per = port.ocean[k] / k; res.oceanCost = r2(per); res.oceanCharge = r2(per + (P.markup.ocean_per_car||0)); }
  return res;
}

/* ===================== financial engine ===================== */
function calc(c){
  const ex = (payer, st) => c.expenses.filter(e => e.payer === payer && e.stage === st).reduce((s,e) => s + N(e.amount), 0);
  const pay = st => c.payments.filter(p => p.stage === st).reduce((s,p) => s + N(p.amount), 0);
  const base = N(c.buyPrice) + N(c.auctionFees);
  const wire = r2(base * N(c.wirePct) / 100);
  const custExp1 = ex('customer','buy'), offExp1 = ex('office','buy');
  const req1 = r2(base + N(c.officeFee) + wire + custExp1);
  const auctionByCust = c.auctionPaid && c.auctionPaid.by === 'customer' ? base : 0;
  const payments1 = pay('buy');
  const paid1 = r2(payments1 + auctionByCust);
  const rem1 = r2(req1 - paid1);
  const profit1 = r2(N(c.officeFee) + wire - offExp1);

  const custExp2 = ex('customer','ship'), offExp2 = ex('office','ship');
  const shipCharge = N(c.towCharge) + N(c.oceanCharge);
  const wire2 = r2((shipCharge + custExp2) * N(c.shipWirePct) / 100);   // optional transfer commission on shipping
  const req2 = r2(shipCharge + custExp2 + wire2);
  const paid2 = r2(pay('ship'));
  const rem2 = r2(req2 - paid2);
  const actual = N(c.towCost) + N(c.oceanCost);
  const profit2 = r2(shipCharge + wire2 - actual - offExp2);

  const advance = (c.auctionPaid && c.auctionPaid.by === 'office' && !c.lock1) ? Math.min(base, Math.max(rem1,0)) : 0;
  const refundDue = r2((c.refunds||[]).filter(x => !x.returned).reduce((s,x) => s + N(x.amount), 0));
  return {base, wire, custExp1, offExp1, req1, auctionByCust, payments1, paid1, rem1, profit1,
          custExp2, offExp2, shipCharge, wire2, req2, paid2, rem2, actual, profit2, advance, refundDue};
}

/* moves the car between financial stages based on money; locks/unlocks profits */
function sync(c){
  const k = calc(c), EPS = 0.004;
  if(!c.lock1 && k.req1 > 0 && k.rem1 <= EPS) c.lock1 = today();
  else if(c.lock1 && k.rem1 > EPS) c.lock1 = null;

  if(!c.lock2 && k.req2 > 0 && k.rem2 <= EPS && c.stage !== 'buy') c.lock2 = today();
  else if(c.lock2 && k.rem2 > EPS) c.lock2 = null;

  if(c.lock1 && c.stage === 'buy') c.stage = 'ship';
  // stage 2 may have been fully paid while stage 1 just finished
  if(!c.lock2 && k.req2 > 0 && k.rem2 <= EPS && c.stage === 'ship') c.lock2 = today();

  if(c.lock1 && c.lock2) c.stage = 'done';
  else if(c.stage === 'done') c.stage = 'ship';
  if(c.stage === 'ship' && !c.lock1 && !c.manualShip) c.stage = 'buy';
}
function commit(c){ if(c) sync(c); save(c); render(); }

/* ===================== router / render ===================== */
function go(view, carId){ ui.view = view; ui.carId = carId || null; window.scrollTo(0,0); render(); }
document.getElementById('nav').addEventListener('click', e => { const a = e.target.closest('a[data-v]'); if(a) go(a.dataset.v); });

function render(){
  $('#officeName').textContent = db.settings.officeName || 'مكتب السيارات';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === ui.view || ((ui.view === 'car' || ui.view === 'group') && a.dataset.v === 'cars') || (ui.view === 'customer' && a.dataset.v === 'customers') || (ui.view === 'container' && a.dataset.v === 'containers')));
  const app = $('#app');
  if(ui.view === 'car'){ const c = getCar(ui.carId); app.innerHTML = c ? viewCar(c) : (ui.view = 'cars', viewCars()); }
  else if(ui.view === 'customer'){ const cu = getCust(ui.carId); app.innerHTML = cu ? viewCustomer(cu) : (ui.view = 'customers', viewCustomers()); }
  else if(ui.view === 'customers') app.innerHTML = viewCustomers();
  else if(ui.view === 'profits') app.innerHTML = viewProfits();
  else if(ui.view === 'group') app.innerHTML = viewGroup();
  else if(ui.view === 'containers') app.innerHTML = viewContainers();
  else if(ui.view === 'container'){ const ct = getCt(ui.carId); app.innerHTML = ct ? viewContainer(ct) : (ui.view = 'containers', viewContainers()); }
  else if(ui.view === 'log'){ const f = document.activeElement && document.activeElement.id === 'lq'; app.innerHTML = viewLog(); if(f){ const e = $('#lq'); e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }
  else if(ui.view === 'map') app.innerHTML = viewMap();
  else app.innerHTML = viewCars();
}

/* ---------- change log ---------- */
const ACT_CLS = {'إضافة':'done', 'تعديل':'ship', 'حذف':'bad'};
function logTime(at){ const d = new Date(at); return isNaN(d) ? '' : d.toLocaleString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false}); }
function logItems(list, showTitle){
  return list.map(l => `<div class="logi">
    <div class="logh">${showTitle ? `<b class="${l.kind !== 'settings' ? 'click' : ''}" ${l.kind === 'car' ? `onclick="go('car','${l.ref}')"` : l.kind === 'customer' ? `onclick="go('customer','${l.ref}')"` : l.kind === 'container' ? `onclick="go('container','${l.ref}')"` : ''}>${esc(l.title)}</b>` : ''}
      <span class="bdg ${ACT_CLS[l.action] || 'exp'}">${esc(l.action)}</span>
      <div class="sp"></div><span class="small muted"><span class="num">${esc(logTime(l.at))}</span> · ${esc((l.by || '').split('@')[0])}</span></div>
    <ul>${(l.changes || []).map(x => `<li>${logLine(x)}</li>`).join('')}</ul></div>`).join('');
}
/* keep $ amounts and dates left-to-right inside Arabic, and show "old ← new" as grey → bold */
function logLine(x){
  const ltr = s => esc(s).replace(/−?\$[\d,]+(?:\.\d+)?|\d{4}-\d{2}-\d{2}|[A-Z0-9]{8,17}/g, m => `<bdi dir="ltr">${m}</bdi>`);
  const i = x.lastIndexOf(' ← ');
  if(i < 0) return ltr(x);
  const j = x.lastIndexOf(': ', i);
  if(j < 0) return ltr(x);
  return `${ltr(x.slice(0, j))}: <span class="lold">${ltr(x.slice(j + 2, i))}</span> ← <span class="lnew">${ltr(x.slice(i + 3))}</span>`;
}
function viewLog(){
  const all = db.log || [], q = (ui.lq || '').trim().toLowerCase(), u = ui.lu || '';
  const users = [...new Set(all.map(l => l.by).filter(Boolean))];
  const list = all.filter(l => (!u || l.by === u) && (!q || [l.title, l.by, ...(l.changes || [])].join(' ').toLowerCase().includes(q)));
  return `
  <div class="row" style="margin-bottom:16px"><h1>سجل التعديلات</h1><div class="sp"></div>
    <span class="small muted">آخر ${all.length} تعديل — مين عدّل شنو ووقتاش</span></div>
  <div class="card">
    <div class="pad row" style="border-bottom:1px solid var(--line)">
      <input class="inp search" id="lq" placeholder="بحث: سيارة، زبون، مبلغ…" value="${esc(ui.lq || '')}" oninput="ui.lq=this.value;render()">
      <select class="inp" style="width:auto" onchange="ui.lu=this.value;render()"><option value="">كل المستخدمين</option>${users.map(x => `<option ${x === u ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
    </div>
    ${list.length ? `<div class="logl">${logItems(list, true)}</div>` : `<div class="empty">${all.length ? 'لا توجد نتائج' : 'ما فيش تعديلات مسجلة بعد — أي تعديل من توا وطالع يتسجل هني'}</div>`}
  </div>`;
}

/* ---------- containers: group cars by export port, assign them, split the real cost ---------- */
const shipPort = c => c.relocPort || c.port || '';
const getCt = id => (db.containers || []).find(x => x.id === id);
const ctCars = ct => db.cars.filter(c => c.containerId === ct.id);
const vin6 = c => (c.vin || '').slice(-6);
const PER = 4;   // cars in a full 40ft container
function portChip(p){ return `<span class="pchipc" style="--pc:${PORT_COLORS[p] || '#bbb'}"></span>`; }
function gCar(c){
  const y = P.yards[c.yard], ct = c.containerId && getCt(c.containerId);
  return `<div class="gcar" onclick="go('car','${c.id}')">${carThumb(c)}
    <div class="gtx"><b>${esc(carName(c))}</b>
      <div class="small"><span class="num muted">…${esc(vin6(c))}</span> · ${esc(c.customer || '—')}</div>
      <div class="small muted">${y ? esc(y.n + ' — ' + y.a) : 'بدون ساحة'}${ct || c.containerNo ? ` · 📦 <span class="num">${esc(ct ? ct.no : c.containerNo)}</span>` : ''}</div></div>
    <span class="bdg loc">${LOC[c.loc || 0]}</span></div>`;
}
function viewGroup(){
  const pend = db.cars.filter(c => (c.loc || 0) < 4);
  const by = {}; pend.forEach(c => { const p = shipPort(c) || '__none'; (by[p] = by[p] || []).push(c); });
  const order = [...P.ports.map(p => p.id).filter(id => by[id]), ...(by.__none ? ['__none'] : [])];
  const block = p => {
    const cars = by[p], n = cars.length;
    if(p === '__none') return `<div class="card gport" style="--pc:#bbb"><div class="gph"><h3>بدون ميناء</h3><span class="muted small">افتح السيارة واختار الساحة</span></div>
      <div class="gcars">${cars.map(gCar).join('')}</div></div>`;
    const wh = cars.filter(c => (c.loc || 0) >= 3).length, full = Math.floor(n / PER), rest = n % PER;
    const st = {}; cars.forEach(c => { const s = (P.yards[c.yard] || {}).s || '—'; (st[s] = st[s] || []).push(c); });
    return `<div class="card gport" style="--pc:${PORT_COLORS[p] || '#bbb'}">
      <div class="gph">${portChip(p)}<h3>${esc(pName(p))}</h3>
        <span class="small"><b>${n}</b> سيارة · <b>${wh}</b> منهم وصلت المستودع</span>
        <span class="bdg ${full ? 'done' : 'exp'}">${full} حاوية كاملة</span>
        ${rest ? `<span class="bdg bad">ناقص ${PER - rest} لحاوية كاملة</span>` : ''}
        <div class="sp"></div><button class="btn sm pri" onclick="assignForm('${p}')">حددهم لرقم الحاوية</button></div>
      ${Object.keys(st).sort().map(s => `<div class="gst">${esc(s)} <span class="muted">(${st[s].length})</span></div><div class="gcars">${st[s].map(gCar).join('')}</div>`).join('')}
    </div>`;
  };
  return `
  <div class="chead"><button class="btn" onclick="go('cars')">→ رجوع</button>
    <div style="flex:1"><h1>سيارات تنشحن مع بعض</h1><div class="muted small">السيارات اللي لسه ما انشحنتش، مقسومة حسب ميناء التصدير — كل ${PER} سيارات = حاوية 40 قدم</div></div>
    <button class="btn pri" onclick="assignForm('')">＋ حاوية من أي سيارات</button>
    <button class="btn" onclick="go('containers')">📦 الحاويات</button></div>
  ${order.length ? order.map(block).join('') : `<div class="card empty">كل السيارات انشحنت — ما فيش سيارات تستنى حاوية</div>`}`;
}
/* choose any cars — from any port, any yard — and put them in a container (new number or an existing one).
   port: the port block the button came from (its cars are listed first); ctId: adding to an existing container */
const SHIPPERS = ['Atlantic Express', 'MTL'];
function shipperList(){ return [...new Set([...SHIPPERS, ...(db.containers || []).map(x => x.shipper).filter(Boolean)])]; }
function assignForm(port, ctId){
  const ct0 = ctId ? getCt(ctId) : null;
  const cars = db.cars.filter(c => (c.loc || 0) < 5 && !(ct0 && c.containerId === ct0.id))
    .sort((a,b) => (shipPort(a) === port ? 0 : 1) - (shipPort(b) === port ? 0 : 1) || (shipPort(a) || 'z').localeCompare(shipPort(b) || 'z') || (a.loc||0) - (b.loc||0));
  const open = (db.containers || []).filter(x => (x.loc ?? 0) < 5);
  const row = c => `<label class="afrow" data-q="${esc([carName(c), c.vin, c.customer, pName(shipPort(c)), (P.yards[c.yard] || {}).n, c.containerNo].join(' ').toLowerCase())}">
      <input type="checkbox" value="${c.id}" onchange="afCount()">
      <span style="flex:1"><b>${esc(carName(c))}</b> <span class="num muted">…${esc(vin6(c))}</span> · ${esc(c.customer || '—')}<br>
      <span class="small muted">${shipPort(c) ? portChip(shipPort(c)) + ' ' + esc(pName(shipPort(c))) : 'بدون ميناء'} · ${esc(((P.yards[c.yard] || {}).n) || 'بدون ساحة')} · ${LOC[c.loc || 0]} · محسوبة على حاوية ${+(c.perContainer || 4)}${c.containerNo ? ` · <span style="color:var(--bad)">حالياً في <span class="num">${esc(c.containerNo)}</span></span>` : ''}</span></span></label>`;
  openModal(ct0 ? `زيد سيارات للحاوية ${esc(ct0.no)}` : `تحديد حاوية${port ? ' — ' + esc(pName(port)) : ''}`, `<form id="af" onsubmit="event.preventDefault();applyAssign('${port || ''}','${ctId || ''}')">
    ${ct0 ? `<input type="hidden" name="no" value="${esc(ct0.no)}"><input type="hidden" name="booking" value=""><input type="hidden" name="shipper" value=""><input type="hidden" name="loc" value="">` : `
    <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">
      <div class="f"><label>رقم الحاوية</label><input class="inp" name="no" list="ctList" required style="direction:ltr;text-transform:uppercase" placeholder="MSKU1234567" oninput="afPick(this.value)">
        <datalist id="ctList">${open.map(x => `<option value="${esc(x.no)}">${esc((x.shipper || '') + ' ' + (x.booking || ''))}</option>`).join('')}</datalist>
        <div class="hint" id="afHint">${open.length ? 'رقم جديد أو حاوية مفتوحة' : ''}</div></div>
      <div class="f"><label>شركة الشحن</label><input class="inp" name="shipper" list="shipList" value="Atlantic Express"><datalist id="shipList">${shipperList().map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
      <div class="f"><label>رقم الحجز (Booking)</label><input class="inp" name="booking" style="direction:ltr"></div>
      <div class="f"><label>المرحلة</label><select class="inp" name="loc"><option value="">— بدون تغيير —</option>${LOC.map((l,i) => `<option value="${i}">${l}</option>`).join('')}</select></div>
    </div>`}
    <div class="row" style="margin-bottom:8px;gap:8px">
      <input class="inp" id="afQ" placeholder="بحث: سيارة، زبون، شاصي، ميناء، ساحة…" oninput="afFilter()" style="flex:1;min-width:200px">
      ${port ? `<button type="button" class="btn sm" onclick="afPort('${port}')">حدد سيارات ${esc(pName(port))}</button>` : ''}
      <button type="button" class="btn sm" onclick="afNone()">شيل التحديد</button>
      <span id="afCnt" class="small"></span></div>
    <div class="aflist">${cars.map(row).join('') || '<div class="empty">ما فيش سيارات</div>'}</div>
    <div class="hint" style="margin-top:6px">تقدر تختار أي سيارة من أي ميناء أو ساحة. لو السيارة في حاوية ثانية، تنتقل لهذي.</div>
  </form>`, `<button class="btn pri" onclick="document.getElementById('af').requestSubmit()">تطبيق</button><button class="btn" onclick="closeModal()">إلغاء</button>`, true);
  afCount(); setTimeout(() => { const q = $('#afQ'); if(q && ct0) q.focus(); }, 40);
}
function afFilter(){ const q = $('#afQ').value.trim().toLowerCase(); document.querySelectorAll('#af .afrow').forEach(r => r.style.display = !q || r.dataset.q.includes(q) ? '' : 'none'); }
function afPort(port){ document.querySelectorAll('#af .afrow input').forEach(i => { const c = getCar(i.value); if(c && shipPort(c) === port && !c.containerId) i.checked = true; }); afCount(); }
function afNone(){ document.querySelectorAll('#af .afrow input').forEach(i => i.checked = false); afCount(); }
function afCount(){
  const sel = [...document.querySelectorAll('#af .afrow input:checked')].map(i => getCar(i.value)).filter(Boolean), n = sel.length;
  const ports = [...new Set(sel.map(shipPort).filter(Boolean))];
  $('#afCnt').innerHTML = `<b>${n}</b> محددة${n > PER ? ` <span style="color:var(--bad)">— أكثر من ${PER}!</span>` : ''}${ports.length > 1 ? ` <span style="color:var(--warn)">— من ${ports.length} مواني</span>` : ''}`;
}
function afPick(v){
  const ct = (db.containers || []).find(x => (x.no || '').toUpperCase() === v.trim().toUpperCase());
  const f = document.getElementById('af');
  if(ct){ if(!f.booking.value) f.booking.value = ct.booking || ''; if(ct.shipper) f.shipper.value = ct.shipper; $('#afHint').innerHTML = `حاوية موجودة فيها <b>${ctCars(ct).length}</b> سيارة — تنضاف لها`; }
  else $('#afHint').textContent = v.trim() ? 'حاوية جديدة' : '';
}
function applyAssign(port, ctId){
  const f = document.getElementById('af'), no = f.no.value.trim().toUpperCase(), booking = f.booking.value.trim(), loc = f.loc.value, shipper = f.shipper.value.trim();
  const ids = [...f.querySelectorAll('.afrow input:checked')].map(x => x.value);
  if(!no) return; if(!ids.length) return toast('حدد سيارة وحدة على الأقل');
  let ct = ctId ? getCt(ctId) : (db.containers || []).find(x => (x.no || '').toUpperCase() === no), isNew = !ct;
  if(!ct){
    const p0 = port || shipPort(getCar(ids[0])) || '';
    ct = {id:uid(), no, booking, shipper, port:p0, shipDate:'', eta:'', loc:loc === '' ? null : +loc, cost:'', shares:{}, created:new Date().toISOString()};
    (db.containers = db.containers || []).push(ct);
  } else { if(booking) ct.booking = booking; if(shipper) ct.shipper = shipper; if(loc !== '') ct.loc = +loc; }
  const names = [], moved = {};
  ids.forEach(id => { const c = getCar(id); if(!c) return;
    if(c.containerId && c.containerId !== ct.id){ const o = getCt(c.containerId); if(o){ (moved[o.id] = moved[o.id] || []).push(carName(c)); if(o.shares) delete o.shares[c.id]; } }
    c.containerId = ct.id; c.containerNo = ct.no; c.booking = ct.booking || '';
    const L = loc !== '' ? +loc : ct.loc;
    if(L != null && (loc !== '' || (c.loc || 0) < L)){ c.loc = L; c.locAt = Object.assign({}, c.locAt, {[L]: today()}); }
    names.push(carName(c)); sync(c); save(c); });
  Object.keys(moved).forEach(oid => { const o = getCt(oid); saveContainer(o, [`انتقلت لحاوية ${ct.no}: ${moved[oid].join('، ')}`]); });
  saveContainer(ct, [`${isNew ? 'حاوية جديدة' : 'إضافة سيارات'}: ${names.join('، ')}`]);
  closeModal(); toast(`تم — ${ids.length} سيارة في الحاوية ${ct.no}`); go('container', ct.id);
}

function saveCtForm(id){
  const d = formData('ctf'); d.no = d.no.trim().toUpperCase();
  const dup = (db.containers || []).find(x => (x.no || '').toUpperCase() === d.no && x.id !== id);
  if(dup) return toast('فيه حاوية بنفس الرقم');
  let ct = id ? getCt(id) : null; const ch = [];
  const F = {no:'رقم الحاوية', shipper:'شركة الشحن', booking:'رقم الحجز', port:'الميناء', shipDate:'تاريخ الشحن', eta:'الوصول المتوقع'};
  if(ct){ Object.keys(F).forEach(k => { if(String(ct[k] || '') !== String(d[k] || '')) ch.push(`${F[k]}: ${ct[k] || '—'} ← ${d[k] || '—'}`); }); Object.assign(ct, d); }
  else { ct = Object.assign({id:uid(), loc:null, cost:'', shares:{}, created:new Date().toISOString()}, d); (db.containers = db.containers || []).push(ct); ch.push('حاوية جديدة'); }
  ctCars(ct).forEach(c => { if(c.containerNo !== ct.no || c.booking !== (ct.booking || '')){ c.containerNo = ct.no; c.booking = ct.booking || ''; save(c); } });
  saveContainer(ct, ch); closeModal(); go('container', ct.id);
}
/* real cost vs what we priced: customers were charged for a container of X cars; if it ships with fewer, each car costs more */
function ctMath(ct){
  const cars = ctCars(ct), Y = cars.length, p = portById(ct.port), oc = p ? p.ocean : {};
  const X = Math.max(0, ...cars.map(c => +(c.perContainer || 4)));
  const expected = r2(cars.reduce((s,c) => { const k = +(c.perContainer || 4), o = (portById(shipPort(c)) || p || {ocean:{}}).ocean; return s + (o[k] ? o[k] / k : N(c.oceanCost)); }, 0));
  const listY = oc[Math.min(4, Math.max(2, Y))] || 0;
  const actual = ct.cost !== '' && ct.cost != null ? N(ct.cost) : (Y ? listY : 0);
  return {cars, Y, X, expected, actual, real:ct.cost !== '' && ct.cost != null, loss:r2(actual - expected),
          charged:r2(cars.reduce((s,c) => s + N(c.oceanCharge), 0)), shares:r2(cars.reduce((s,c) => s + N(c.oceanCost), 0))};
}

function ctLoc(id, i){
  const ct = getCt(id), cars = ctCars(ct); if(ct.loc === i) return;
  ask(`تغيير مرحلة الحاوية إلى <b>${LOC[i]}</b>؟ تتغير معاها ${cars.length} سيارة.`, () => {
    const old = ct.loc; ct.loc = i;
    if(i === 4 && !ct.shipDate) ct.shipDate = today();
    cars.forEach(c => { c.loc = i; c.locAt = Object.assign({}, c.locAt, {[i]: today()}); sync(c); save(c); });
    saveContainer(ct, [`المرحلة: ${old != null ? LOC[old] : '—'} ← ${LOC[i]} (${cars.length} سيارة)`]); render(); toast('تم تحديث المرحلة');
  }, 'تغيير');
}
function ctSetCost(id){
  const ct = getCt(id), cars = ctCars(ct), v = $('#ctCost').value;
  if(v === '' || !cars.length) return toast(cars.length ? 'اكتب التكلفة' : 'الحاوية فاضية');
  const tot = r2(N(v)), each = r2(tot / cars.length); let left = tot;
  const old = ct.cost; ct.cost = tot; ct.shares = {};
  cars.forEach((c, i) => { const s = i === cars.length - 1 ? r2(left) : each; left = r2(left - s); c.oceanCost = s; c.oceanActual = true; sync(c); save(c); });
  saveContainer(ct, [`التكلفة الفعلية: ${old !== '' && old != null ? $t(old) : '—'} ← ${$t(tot)} — مقسومة على ${cars.length} (${$t(each)} للسيارة)`]); render(); toast('تم التقسيم');
}

const pcls = n => n < 0 ? 'pneg' : 'ppos';   // loss red, profit green

/* ---------- customers ---------- */
function custStats(cu){
  const cars = db.cars.filter(c => c.customerId === cu.id);
  let due1 = 0, due2 = 0, refund = 0, active = 0;
  cars.forEach(c => { const k = calc(c); due1 += Math.max(k.rem1,0); due2 += c.stage !== 'buy' ? Math.max(k.rem2,0) : 0; refund += k.refundDue; if(c.stage !== 'done') active++; });
  due1 = r2(due1); due2 = r2(due2);
  return {cars, due:r2(due1 + due2), due1, due2, refund, active};
}
/* remaining per stage as pills: red = still owed, green = paid up */
function duePills(s){
  const p = (t, v) => `<span class="pchip ${v > 0.009 ? 'pneg' : 'ppos'}"><i>${t}</i>${v > 0.009 ? money(v) : 'خالص ✓'}</span>`;
  return `<div class="pchips">${p('شراء', s.due1)}${p('شحن', s.due2)}</div>`;
}

    .sort((a,b) => (a.cu.name||'').localeCompare(b.cu.name||'', 'ar'));
  const totDue = all.reduce((s,o) => s + o.s.due, 0), totRef = all.reduce((s,o) => s + o.s.refund, 0);
  const tot1 = r2(all.reduce((s,o) => s + o.s.due1, 0)), tot2 = r2(all.reduce((s,o) => s + o.s.due2, 0));
  const unlinked = db.cars.filter(c => !c.customerId && c.customer);
  const rows = list.map(({cu, s}) => `<tr class="click" onclick="go('customer','${cu.id}')">

    <td>${s.refund > 0 ? `<span style="color:var(--info)">${money(s.refund)}</span>` : '<span class="muted">—</span>'}</td></tr>`).join('');

  </div>
  ${unlinked.length ? `<div class="note info">فيه ${unlinked.length} سيارة قديمة مكتوب عليها اسم زبون بس مش مربوطة بقائمة الزبائن.
    <button class="btn sm" style="margin-right:8px" onclick="linkOldCustomers()">سجّلهم في الزبائن واربطهم</button></div>` : ''}

    <div class="pad row" style="border-bottom:1px solid var(--line)"><div class="sp"></div>

      : `<div class="empty">${db.customers.length ? 'لا توجد نتائج' : 'لا يوجد زبائن بعد — اضغط <b>＋ زبون جديد</b>'}</div>`}
  </div>`;
}

function custForm(id){
  const cu = id ? getCust(id) : {};
  openModal(id ? 'تعديل الزبون' : 'زبون جديد', `<form id="uf" class="grid" onsubmit="event.preventDefault();saveCustForm('${id||''}')">
    ${fld('الاسم','name',cu.name,'text','required','full')}
    ${fld('الهاتف','phone',cu.phone,'tel','style="direction:ltr;text-align:right"')}
    ${fld('هاتف آخر','phone2',cu.phone2,'tel','style="direction:ltr;text-align:right"')}
    ${fld('المدينة / العنوان','city',cu.city,'text','','full')}
    <div class="f full"><label>ملاحظات</label><textarea class="inp" name="notes" rows="2">${esc(cu.notes||'')}</textarea></div>
  </form>`, `<button class="btn pri" onclick="document.getElementById('uf').requestSubmit()">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
function saveCustForm(id){
  const d = formData('uf'); d.name = d.name.trim(); if(!d.name) return;
  let cu = id ? getCust(id) : null;
  if(cu){
    Object.assign(cu, d);
    db.cars.filter(c => c.customerId === cu.id).forEach(c => { c.customer = cu.name; c.phone = cu.phone; save(c); });
  } else { cu = Object.assign({id:uid(), created:new Date().toISOString()}, d); db.customers.push(cu); }
  saveCust(cu); closeModal();
  if(!id) go('customer', cu.id); else render();
  toast('تم حفظ الزبون');
}
function delCust(id){
  if(db.cars.some(c => c.customerId === id)) return toast('ما تقدرش تحذف زبون عنده سيارات — احذف سياراته أو انقلها لزبون آخر أولاً');
  ask('حذف هذا الزبون؟', () => { removeCust(id); go('customers'); toast('تم الحذف'); }, 'حذف');
}
/* cars saved before the customers list existed: group them by name + phone into customers */
function linkOldCustomers(){
  const map = {};
  db.cars.filter(c => !c.customerId && c.customer).forEach(c => {
    const key = c.customer.trim() + '|' + (c.phone||'').trim();
    let cu = map[key] || db.customers.find(x => x.name === c.customer.trim() && (x.phone||'') === (c.phone||'').trim());
    if(!cu){ cu = {id:uid(), created:new Date().toISOString(), name:c.customer.trim(), phone:(c.phone||'').trim(), phone2:'', city:'', notes:''}; db.customers.push(cu); saveCust(cu); }
    map[key] = cu; c.customerId = cu.id; save(c);
  });
  render(); toast('تم ربط السيارات بالزبائن');
}

/* ---------- car detail ---------- */
function ln(label, val, cls=''){ return `<div class="ln ${cls}"><span>${label}</span><b>${val}</b></div>`; }

          : `✓ الزبون سدد للمزاد مباشرة (${money(k.base)}) بتاريخ ${dt(c.auctionPaid.date)} — تبقى عليه العمولات والمصاريف.`}

      ${k.auctionByCust ? ln('مدفوع للمزاد من الزبون', money(k.auctionByCust)) : ''}
      ${ln('دفعات الزبون', money(k.payments1))}
      ${ln('الباقي', money(k.rem1), 'rem ' + (k.rem1 > 0 ? 'due' : 'zero'))}
      ${auctionBox}
      ${payCostMissing(c) ? `<div class="note bad">⚠ ما سجلتش كم كلفك الدفع للمزاد (بطاقة / PayPal / صرف). المكسب تحت ممكن يكون أكبر من الحقيقة.

      <div class="profit ${k.profit1 < 0 ? 'loss' : c.lock1 ? 'recv' : ''}">
        <div class="row"><span class="small muted" style="font-weight:700">${k.profit1 < 0 ? 'خسارة المرحلة 1' : 'مكسب المرحلة 1'}</span><div class="sp"></div>

  </div>`;

  const stage2 = `

/* ---------- profits ---------- */
function profitRows(){
  const rows = [];
  db.cars.forEach(c => { const k = calc(c);
    rows.push({c, stage:'buy', amount:k.profit1, date:c.lock1});
    rows.push({c, stage:'ship', amount:k.profit2, date:c.lock2});
  });
  return rows;
}
function viewProfits(){
  const all = profitRows(), m = ui.allMonths ? '' : ui.month;
  const recv = all.filter(r => r.date && (!m || r.date.startsWith(m)));
  const sum = a => a.reduce((s,r) => s + r.amount, 0);
  const sets = {
    recv:  {t:'مكسب مستلم', rows:recv},
    recv1: {t:'مستلم — مرحلة الشراء', rows:recv.filter(r => r.stage === 'buy')},
    recv2: {t:'مستلم — مرحلة الشحن', rows:recv.filter(r => r.stage === 'ship')},
  };
  const card = (key, hl) => `<div class="card kpi click ${hl ? 'hl' : ''} ${ui.drill === key ? 'sel' : ''}" onclick="ui.drill='${key}';render()">
      <div class="l">${sets[key].t}</div><div class="v">${money(sum(sets[key].rows))}</div><div class="small muted">${sets[key].rows.length} مرحلة</div></div>`;
  const d = sets[ui.drill] || sets.recv;
  const drows = d.rows.slice().sort((a,b) => (b.date||'').localeCompare(a.date||'')).map(r => `<tr class="click" onclick="go('car','${r.c.id}')">
      <td><div class="carcell">${carThumb(r.c)}<div><b>${esc(carName(r.c))}</b><div class="small muted vinln"><span class="num">${esc(r.c.vin||r.c.lot||'')}</span></div></div></div></td><td>${esc(r.c.customer||'—')}</td>
      <td><span class="bdg ${r.stage}">${STG[r.stage]}</span></td>
      <td class="num">${r.date ? esc(r.date) : '<span class="muted">لم تكتمل</span>'}</td>
      <td><b class="${pcls(r.amount)}">${money(r.amount)}</b></td></tr>`).join('');

  // last 12 months
  const months = []; const now = new Date();
  for(let i = 11; i >= 0; i--){ const dt = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0')); }
  const mv = months.map(mm => ({mm, v: sum(all.filter(r => r.date && r.date.startsWith(mm)))}));
  const max = Math.max(1, ...mv.map(x => x.v));

  return `
  <div class="row" style="margin-bottom:16px">
    <h1>الأرباح</h1><div class="sp"></div>
    <label class="row small" style="gap:6px"><input type="checkbox" ${ui.allMonths ? 'checked' : ''} onchange="ui.allMonths=this.checked;render()" style="accent-color:var(--brand)"> كل الشهور</label>
    <input type="month" class="inp" style="width:auto" value="${ui.month}" ${ui.allMonths ? 'disabled' : ''} onchange="ui.month=this.value||thisMonth();render()">
  </div>
  <div class="small muted" style="margin:-6px 0 10px">المستلم حسب تاريخ قفل المرحلة${m ? ' — ' + monthName(m) : ''}</div>
  <div class="kpis">${card('recv',true)}${card('recv1')}${card('recv2')}</div>
  <div class="card" style="margin-bottom:16px">
    <div class="pad row" style="border-bottom:1px solid var(--line)"><h3>${d.t}</h3><span class="muted small">— السيارات اللي وراه</span><div class="sp"></div><b>${money(sum(d.rows))}</b></div>
    ${drows ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>السيارة</th><th>الزبون</th><th>المرحلة</th><th>تاريخ القفل</th><th>المكسب</th></tr></thead><tbody>${drows}</tbody></table></div>` : `<div class="empty">لا يوجد</div>`}
  </div>
  <div class="card pad">
    <h3 style="margin-bottom:10px">المكسب المستلم — آخر 12 شهر</h3>
    <div class="bars">${mv.map(x => `<div class="br" style="cursor:pointer" onclick="ui.month='${x.mm}';ui.allMonths=false;ui.drill='recv';render()"><span class="small">${monthName(x.mm)}</span><div class="track"><div class="fill" style="width:${Math.max(0, x.v/max*100)}%"></div></div><b style="text-align:end">${money(x.v)}</b></div>`).join('')}</div>
  </div>`;
}

/* VIN → year / make / model from the free NHTSA decoder (works for cars made for the US market) */
async function vinLookup(force){
  const el = cfEl('vin'), h = $('#vinHint');
  const v = el.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ''); el.value = v;
  if(v.length !== 17){ if(force) h.textContent = `رقم الهيكل لازم يكون 17 خانة (كتبت ${v.length})`; return; }
  if(vinLookup.last === v && !force) return; vinLookup.last = v;
  h.textContent = 'جاري البحث…';
  try{
    const r = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${v}?format=json`);
    const x = (await r.json()).Results[0];
    if(!x || !x.Make){ h.textContent = 'ما لقيناش بيانات لهذا الرقم — تأكد منه أو اكتب الاسم يدوياً'; return; }
    const make = x.Make.split(/\s+/).map(w => w.length <= 3 ? w : w[0] + w.slice(1).toLowerCase()).join(' ');
    const name = [make, x.Model, x.Trim && x.Trim.length <= 14 ? x.Trim : ''].filter(Boolean).join(' ');
    if(x.ModelYear) cfEl('year').value = x.ModelYear;
    cfEl('make').value = name;
    h.innerHTML = `✓ <b>${esc(x.ModelYear)} ${esc(name)}</b>${x.BodyClass ? ' · ' + esc(x.BodyClass) : ''}${x.DisplacementL ? ' · <span class="num">' + esc((+x.DisplacementL).toFixed(1)) + 'L</span>' : ''}`;
  }catch(e){ vinLookup.last = null; h.textContent = 'تعذر الاتصال بخدمة رقم الهيكل — تأكد من الإنترنت'; }
}

function imgSet(v){

function canLoadImage(u){
  return new Promise(res => { const i = new Image(); const t = setTimeout(() => res(false), 7000);
    i.referrerPolicy = 'no-referrer'; i.onload = () => { clearTimeout(t); res(i.naturalWidth > 40); }; i.onerror = () => { clearTimeout(t); res(false); }; i.src = u; });
}
async function imgFromLink(force){
  const u = cfEl('link').value.trim(), h = $('#imgHint');
  if(!/^https?:\/\//i.test(u)){ if(force || u) h.textContent = 'الصق رابط يبدأ بـ https://'; return; }

    const im = j.status === 'success' && j.data && j.data.image && j.data.image.url;
    if(im && await canLoadImage(im)){ imgSet(im); h.textContent = '✓ تم جلب الصورة من الصفحة'; return; }
  }catch(e){}
  h.innerHTML = 'ما قدرناش نجيب صورة من هذي الصفحة. افتحها، كليك يمين على صورة السيارة ← <b>نسخ عنوان الصورة</b> (Copy image address) والصقه هنا، أو ارفع الصورة من الجهاز. الرابط يبقى محفوظ.';

function imgUpload(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { const i = new Image(); i.onload = () => {
    const sc = Math.min(1, 900 / Math.max(i.width, i.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(i.width * sc); cv.height = Math.round(i.height * sc);
    cv.getContext('2d').drawImage(i, 0, 0, cv.width, cv.height);
    imgSet(cv.toDataURL('image/jpeg', 0.72)); $('#imgHint').textContent = '✓ تمت إضافة الصورة من الجهاز';
  }; i.src = rd.result; };
  rd.readAsDataURL(f);
}

function pfCheck(){

function savePayment(id, pid){

  if(pid) c.payments = c.payments.filter(x => x.id !== pid);   // editing: replace the old payment, keep its id
  const k = calc(c); const rem = Math.max(0, d.stage === 'buy' ? k.rem1 : k.rem2);

    if(rem > 0) c.payments.push(Object.assign({id:newId, stage:d.stage, amount:rem}, base));
    if(d.over === 'next' && d.stage === 'buy'){

  toast(c.stage !== before ? (c.stage === 'done' ? 'اكتملت السيارة ✓ — المكسب مستلم' : c.stage === 'ship' ? 'اكتملت المرحلة 1 ✓ — انتقلت للشحن' : 'تم التعديل') : pid ? 'تم تعديل الدفعة' : 'تم تسجيل الدفعة');
}

function trackUrl(vin){

function trkSnap(c){
  const k = calc(c), port = portById(c.relocPort || c.port);
  const ce = st => c.expenses.filter(e => (e.payer === 'customer' || e.onInv) && e.stage === st).map(e => e.payer === 'customer'

              {t:`عمولة الحوالة (${+N(c.wirePct).toFixed(2)}%)`, a:k.wire}, ...ce('buy')];
  const s2 = [{t:'السحب الداخلي', a:r2(c.towCharge)}, {t:'الشحن البحري', a:r2(c.oceanCharge)}, ...ce('ship')];
  if(k.wire2) s2.push({t:`عمولة الحوالة (${+N(c.shipWirePct).toFixed(2)}%)`, a:k.wire2});
  const showShip = c.stage !== 'buy' || k.paid2 > 0;

const hstr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
let trkBusy = false;
/* keep tracking/{VIN} in step with the cars: write what changed, remove VINs that no longer exist */
async function syncTracking(){
  if(!USE_FB || PUB || trkBusy || !fbAuth.currentUser) return;
  trkBusy = true;
  try{
    let seen = {}; try{ seen = JSON.parse(localStorage.getItem('trk_h') || '{}'); }catch(e){}
    const now = {};
    for(const c of db.cars){
      const v = vinKey(c.vin); if(v.length < 5) continue;
      const snap = trkSnap(c), h = hstr(JSON.stringify(snap)); now[v] = h;
      if(seen[v] !== h){ snap.updated = new Date().toISOString(); await fs.collection('tracking').doc(v).set(snap); }
    }
    for(const v of Object.keys(seen)) if(!now[v]) await fs.collection('tracking').doc(v).delete().catch(() => {});
    try{ localStorage.setItem('trk_h', JSON.stringify(now)); }catch(e){}
  }catch(e){ console.error('tracking sync', e); }
  finally{ trkBusy = false; }
}

}

const oiTitle = s => String(s || '').trim().split(/\s+/).map(w => /^[A-Z0-9-]{1,3}$/.test(w) || /[a-z]/.test(w) ? w : w.charAt(0) + w.slice(1).toLowerCase()).join(' ');
function oiLoc(s){
  s = String(s || '').toUpperCase();
  if(/DELIVER|RECEIV|HANDED|COMPLETE|CLOSED/.test(s)) return 6;
  if(/ARRIV|DESTIN|CUSTOMS|DISCHARG|LIBYA/.test(s)) return 5;
  if(/SHIP|SEA|VESSEL|LOAD|OCEAN|SAIL/.test(s)) return 4;
  if(/WAREHOUSE/.test(s)) return 3;
  if(/INLAND|TRANSIT|TOW|PICK/.test(s)) return 2;
  if(/PAID/.test(s) && !/PENDING/.test(s)) return 1;
  return 0;
}
const OI_FINE = /storage|late|fine|penalt|relist|غرام|تخزين|تأخير|أرضية/i;
const OI_ITEM = {late_fee:'غرامة تأخير', storage:'تخزين', other:'رسوم أخرى', relist:'إعادة عرض'};
function oiCar(v, vi, custId, cust){
  const f = v.fin || {}, mk = P.markup || {};
  const yardIdx = P.yards.findIndex(y => y.s === v.yard_state && y.n.toLowerCase() === String(v.yard || '').toLowerCase());
  const base = N(f.bid_price) + N(f.auction_fees);
  const tc = N(f.transfer_commission);
  // the old program charged one % on the purchase (paid with stage 1) and the same % on shipping + shipping extras (paid later)
  const pct = N(((v.transfers || []).find(t => t.cust_pct) || {}).cust_pct) || 1.5;
  const shipBase = N(f.inland_shipping) + N(f.ocean_shipping) + (v.extras || []).filter(x => x.st !== 1).reduce((s, x) => s + N(x.a), 0);
  let wirePct = pct, shipWirePct = pct;
  if(Math.abs(r2(base * pct / 100) + r2(shipBase * pct / 100) - tc) > 0.03){
    // e.g. the % was also taken on a stage-1 fine: shipping keeps its %, stage 1 keeps the rest of the old amount
    const w1 = r2(tc - r2(shipBase * pct / 100));
    if(w1 >= 0 && base > 0) wirePct = Math.round(w1 / base * 100 * 1e6) / 1e6;
    else { wirePct = base > 0 ? Math.round(tc / base * 100 * 1e6) / 1e6 : 1.5; shipWirePct = 0; }
  }
  const actual = N(vi && vi.shipping_cost_actual);
  let oceanCost = Math.max(0, N(f.ocean_shipping) - N(mk.ocean_per_car)), towCost, estimated = false;
  if(actual > 0){ towCost = r2(actual - oceanCost); if(towCost < 0){ towCost = 0; oceanCost = actual; } }
  else { towCost = Math.max(0, N(f.inland_shipping) - N(mk.tow)); estimated = true; }
  const auctionTr = (v.transfers || []).filter(t => t.purpose === 'auction');
  const by = v.auction_paid_by === 'office' || v.auction_paid_by === 'customer' ? v.auction_paid_by : (auctionTr.length ? 'office' : null);
  const date = v.purchase_date || String(v.created_at || '').slice(0,10) || today();
  const expenses = [];
  (v.extras || []).forEach((x, i) => expenses.push({id:'old_x' + i, desc:x.d || 'رسوم', amount:r2(N(x.a)), date, payer:'customer',
    stage:x.st === 1 ? 'buy' : 'ship', kind:OI_FINE.test(x.d || '') || x.st === 1 ? 'fine' : 'expense'}));
  if(N(f.other_fees) > 0) expenses.push({id:'old_of', desc:'رسوم أخرى', amount:r2(N(f.other_fees)), date, payer:'customer', stage:'buy', kind:'expense'});
  // fines the office paid to the auction (late fee, storage…) — not charged to the customer in the old program
  (v.transfers || []).filter(t => t.purpose && t.purpose !== 'auction').forEach(t => (t.items || []).forEach((it, i) => {
    if(!N(it.a)) return;
    expenses.push({id:'old_t' + t.id + '_' + i, desc:[OI_ITEM[it.k] || it.k || 'رسوم', t.payee, it.note || t.notes].filter(Boolean).join(' — '),
      amount:r2(N(it.a)), date:t.date || date, payer:'office', stage:'buy', kind:'fine'});
  }));
  // what the office really paid to move the money (PayPal / card fees, FX loss, invoice gaps) — borne by the office, not the customer
  const tcost = (vi && vi.tcost) || {}, tcostd = (vi && vi.tcostd) || {};
  const OI_PAYM = {paypal:'PayPal', card:'بطاقة', wire:'حوالة', zelle:'Zelle', cash:'نقدي'};
  Object.keys(tcost).forEach(tid => {
    const amt = r2(N(tcost[tid])); if(!amt) return;
    const d = tcostd[tid] || {}, tr = (v.transfers || []).find(t => t.id === tid) || {};
    const fine = amt > 0 && OI_FINE.test(d.note || '');
    const m = d.method || tr.method;
    const desc = [amt < 0 ? 'استرجاع على الدفع' : fine ? 'تخزين / تأخير' : 'عمولة الدفع', m && m !== 'other' ? (OI_PAYM[m] || m) : '', tr.payee, d.note].filter(Boolean).join(' — ');
    expenses.push({id:'old_c' + tid, desc, amount:amt, date:tr.date || String(d.at || '').slice(0,10) || date, payer:'office',
      stage:tr.purpose && /ship|tow|ocean|freight/i.test(tr.purpose) ? 'ship' : 'buy', kind:fine ? 'fine' : 'expense'});
  });
  const notes = [v.notes, v.engine && 'المحرك: ' + v.engine, v.color && 'اللون: ' + v.color,
    v.container_number && 'الحاوية: ' + v.container_number, v.booking_number && 'الحجز: ' + v.booking_number,
    estimated && '(تكلفة الشحن الفعلية مش مسجلة في البرنامج القديم — مقدّرة)'].filter(Boolean).join(' · ');
  return {
    id:v.id, created:v.created_at || new Date().toISOString(), customerId:custId, customer:cust ? cust.name : '', phone:cust ? cust.phone : '',
    date, year:String(v.year || ''), make:[oiTitle(v.make), oiTitle(v.model)].filter(Boolean).join(' '), vin:v.vin || '', lot:v.lot_number || '',
    auction:['Copart','IAAI','Manheim'].includes(v.auction_name) ? v.auction_name : (v.auction_name ? 'أخرى' : 'Copart'),
    yard:yardIdx >= 0 ? yardIdx : null, port:v.us_port || '', perContainer:N(v.cars_per_container) || db.settings.perContainer || 4,
    buyPrice:N(f.bid_price), auctionFees:N(f.auction_fees), officeFee:N(f.office_commission), wirePct, shipWirePct,
    towCharge:N(f.inland_shipping), oceanCharge:N(f.ocean_shipping), towCost, oceanCost,
    notes, loc:oiLoc(v.status), auctionPaid:by ? {by, date:v.auction_paid_date || (auctionTr[0] && auctionTr[0].date) || date} : null,
    expenses, oldImported:today()
  };
}

/* old payments → stage-1 payments only, up to what stage 1 still needs; anything beyond is reported, not imported */
const OI_METHOD = {cash_usd:'نقدي', cash:'نقدي', cash_lyd:'نقدي', bank:'حوالة مصرفية', transfer:'تحويل', wire:'حوالة مصرفية', cheque:'صك', check:'صك'};
function oiPayments(car, list){
  const total = r2(list.reduce((s, p) => s + N(p.amount_usd != null ? p.amount_usd : p.amount), 0));
  // in the old program "customer paid the auction" meant the customer's money went through the office — it's inside these payments
  if(car.auctionPaid && car.auctionPaid.by === 'customer' && total >= N(car.buyPrice) + N(car.auctionFees) - 0.01) car.auctionPaid.by = 'office';
  const own = (getCar(car.id) || {}).payments || [];
  const tmp = Object.assign({stage:'buy', refunds:[], payments:own.filter(p => !String(p.id).startsWith('old_') && p.stage === 'buy')}, car);
  let room = Math.max(0, calc(tmp).rem1);
  car.oldPayments = []; car.skippedPay = 0;
  list.slice().sort((a,b) => String(a.date).localeCompare(String(b.date))).forEach(p => {
    const usd = r2(N(p.amount_usd != null ? p.amount_usd : p.amount));
    const take = r2(Math.min(usd, room)); room = r2(room - take);
    if(take > 0) car.oldPayments.push({id:'old_p' + p.id, stage:'buy', amount:take, date:p.date || String(p.created_at || '').slice(0,10),
      method:OI_METHOD[p.method] || 'أخرى',
      note:[p.ref, p.receipt_notes, p.currency && p.currency !== 'USD' ? `${p.amount} ${p.currency} بسعر ${p.rate}` : ''].filter(Boolean).join(' · ')});
    car.skippedPay = r2(car.skippedPay + usd - take);
  });
}

/* the old program kept each car's photos in tracking/{VIN}.images (readable without signing in) */
async function oldPhotos(vins){
  if(!oldApp) oldApp = firebase.initializeApp(OLD_CFG, 'old');
  const ofs = oldApp.firestore(), res = {};
  await Promise.all([...new Set(vins.filter(Boolean))].map(async vin => {
    try{
      const d = await ofs.collection('tracking').doc(vin).get();
      const imgs = d.exists ? (d.data().images || []) : [];
      const order = s => s === 'auction' ? 0 : 1;
      const list = imgs.filter(x => x && x.src).sort((a,b) => order(a.stage) - order(b.stage) || String(a.at).localeCompare(String(b.at))).map(x => x.src);
      if(list.length) res[vin] = [...new Set(list)];
    }catch(e){}
  }));
  return res;
}
function applyOldPhotos(c, list){
  if(!list || !list.length) return;
  const own = c.img && !(c.photos || []).includes(c.img) && !list.includes(c.img);   // a photo picked by hand here wins
  c.photos = list;
  if(!own) c.img = list[0];
}
async function syncOldPhotos(){
  const map = await oldPhotos(db.cars.map(c => c.vin));
  let n = 0;
  for(const c of db.cars){ if(map[c.vin]){ applyOldPhotos(c, map[c.vin]); save(c); n++; } }
  render(); return n;
}
async function oldImportRun(){
  if(!oldPlan) return;
  $('#oiBtns').innerHTML = '<span class="muted">جاري الاستيراد…</span>';
  const ops = [];
  oldPlan.custs.forEach(cu => { delete cu._new; db.customers.push(cu); ops.push(b => b.set(fs.collection('customers').doc(cu.id), plain(cu))); });
  oldPlan.cars.forEach(n => {
    let c = getCar(n.id);
    const oldPays = n.oldPayments || []; delete n.oldPayments; delete n.skippedPay;
    if(c){ // keep what was added here (payments, refunds, photo, own expenses); refresh the rest
      const own = (c.expenses || []).filter(e => !String(e.id).startsWith('old_'));
      // keep changes made here to imported expenses (e.g. a fine moved onto the office)
      n.expenses.forEach(e => { const prev = (c.expenses || []).find(x => x.id === e.id); if(prev) Object.assign(e, {payer:prev.payer, kind:prev.kind, stage:prev.stage}); });
      const ownPays = (c.payments || []).filter(p => !String(p.id).startsWith('old_'));
      Object.assign(c, n, {expenses:own.concat(n.expenses), payments:oldPays.concat(ownPays), created:c.created, loc:Math.max(c.loc || 0, n.loc)});
    } else { c = Object.assign({stage:'buy', payments:oldPays, refunds:[], lock1:null, lock2:null, manualShip:false}, n); db.cars.push(c); }
    applyOldPhotos(c, n.photos);
    const hadLock = c.lock1; sync(c);
    // stage 1 closed by old payments: profit was received on the last payment's date, not today
    if(c.lock1 && !hadLock && oldPays.length && !c.payments.some(p => p.stage === 'buy' && !String(p.id).startsWith('old_')))
      c.lock1 = oldPays.map(p => p.date).filter(Boolean).sort().pop() || c.lock1; ops.push(b => b.set(fs.collection('cars').doc(c.id), plain(c)));
  });
  try{
    for(let i = 0; i < ops.length; i += 400){ const b = fs.batch(); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); }
    const n = oldPlan.cars.length; oldPlan = null; closeModal(); go('cars'); toast(`تم استيراد ${n} سيارة`);
    if(oldApp) oldApp.auth().signOut();
  }catch(e){ fbErr(e); $('#oiBtns').innerHTML = `<button class="btn pri" onclick="oldImportRun()">إعادة المحاولة</button>`; }
}
