<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS COMPANY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --ink: #0F172A;
  --muted: #64748B;
  --line: #E2E8F0;
  --line-2: #EDF2F7;
  --brand: #EA580C;
  --brand-d: #C2410C;
  --brand-soft: #FFEDD5;
  --brand-softer: #FFF7ED;
  --brand-shadow: rgba(234, 88, 12, 0.25);
  --ok: #059669;
  --ok-soft: #D1FAE5;
  --bad: #E11D48;
  --bad-soft: #FFE4E6;
  --info: #0284C7;
  --info-soft: #E0F2FE;
  --warn: #D97706;
  --warn-soft: #FEF3C7;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
  --shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 12px 30px -4px rgba(15, 23, 42, 0.1);
  --side: 260px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: "Tajawal", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* Side Navigation */
#side{
  position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--side);
  background: #0F172A;
  color: #F8FAFC;
  display:flex;flex-direction:column;gap:12px;padding:20px 16px;z-index:30;
  box-shadow: 4px 0 24px rgba(0,0,0,0.06);
}
#side .brand{
  display:flex;flex-direction:row;align-items:center;gap:12px;padding:6px 8px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
#side .brand img{height:38px;width:auto;border-radius:8px}
#side .brand span{font-weight:800;font-size:16px;letter-spacing:0.3px;color:#fff}
#side .navlbl{font-size:11.5px;font-weight:700;color:#94A3B8;padding:8px 12px 2px;text-transform:uppercase;letter-spacing:0.8px}

#side .newcar{
  width:100%;justify-content:center;padding:12px 14px;border-radius:var(--radius-sm);
  background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
  border:0;color:#fff;font-weight:800;font-size:14.5px;cursor:pointer;
  box-shadow: 0 4px 14px var(--brand-shadow);
  transition: all .2s ease;
}
#side .newcar:hover{
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(234, 88, 12, 0.4);
}
#side .newcar:active{transform: translateY(0)}

#nav{display:flex;flex-direction:column;gap:5px}
#nav a,.sbtn{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);
  color:#94A3B8;text-decoration:none;font-weight:600;font-size:14.5px;cursor:pointer;
  border:0;background:transparent;width:100%;text-align:start;transition:all .18s ease;
}
#nav a .ic,.sbtn .ic{
  width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  background: rgba(255,255,255,0.05);color:#94A3B8;flex:none;transition:all .18s ease;
}
#nav a svg,.sbtn svg{width:18px;height:18px}
#nav a:hover,.sbtn:hover{background:rgba(255,255,255,0.06);color:#fff}
#nav a:hover .ic,.sbtn:hover .ic{background:rgba(255,255,255,0.1);color:#fff}
#nav a.on{background:rgba(234, 88, 12, 0.15);color:#FB923C}
#nav a.on .ic{background:var(--brand);color:#fff;box-shadow:0 2px 10px var(--brand-shadow)}
#nav a .ext{margin-inline-start:auto;opacity:.5;width:14px;height:14px}
#side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,0.08);padding-top:12px}
#cloud .em{display:block;font-size:12px;color:#94A3B8;padding:4px 10px;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.sbtn.out{color:#FDA4AF} .sbtn.out .ic{background:rgba(225,29,72,0.15);color:#FB7185}
.sbtn.out:hover{background:rgba(225,29,72,0.2);color:#fff}

main{max-width:1380px;margin-inline-start:var(--side);padding:28px 36px 80px}

@media (max-width:900px){
  #side{position:sticky;inset:auto;top:0;width:auto;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);box-shadow:none;background:#0F172A}
  #side .brand{border:0;padding:0}
  #side .brand img{height:30px} #side .brand span,#side .navlbl,#cloud .em{display:none}
  #nav{position:fixed;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,0.06);z-index:40}
  #nav a{flex-direction:column;gap:3px;padding:3px 2px;font-size:11px;width:auto;flex:1;align-items:center;color:var(--muted);background:transparent !important}
  #nav a.on{color:var(--brand)}
  #nav a .ic{width:38px;height:28px;border-radius:18px;background:transparent}
  #nav a.on .ic{background:var(--brand-soft);color:var(--brand);box-shadow:none}
  #nav a .ext{display:none}
  .sbtn{width:auto;padding:4px;font-size:0}
  #side .foot{margin:0 0 0 auto;flex-direction:row;border:0;padding:0}
  #side .newcar{width:auto;padding:8px 14px}
  main{margin:0;padding:16px 14px 100px}
}

/* Modern Buttons */
.btn{
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  transition: all .16s ease;
  box-shadow: var(--shadow-sm);
}
.btn:hover{background: var(--surface-2); border-color: #CBD5E1; transform: translateY(-1px)}
.btn:active{transform: translateY(1px)}
.btn.pri{
  background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 12px var(--brand-shadow);
}
.btn.pri:hover{
  background: linear-gradient(135deg, #EA580C 0%, #C2410C 100%);
  box-shadow: 0 6px 16px rgba(234, 88, 12, 0.35);
}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);background:#FFF;border-color:#FECDD3}
.btn.danger:hover{background:var(--bad-soft);border-color:#FDA4AF}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Cards & Grid Containers */
.card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: border-color .15s ease;
}
.pad{padding:20px 24px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
h1{font-size:24px;font-weight:900;margin:0;color:var(--ink);letter-spacing:-0.3px}
h2{font-size:19px;font-weight:800;margin:0}
h3{font-size:16px;font-weight:800;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Enhanced KPI Tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px}
.kpi{padding:18px 20px;border-radius:var(--radius);position:relative;overflow:hidden}
.kpi .l{color:var(--muted);font-size:13.5px;font-weight:700}
.kpi .v{font-size:27px;font-weight:900;margin-top:6px;letter-spacing:-0.5px}
.kpi.hl{
  background: linear-gradient(145deg, #FFF7ED 0%, #FFEDD5 100%);
  border-color: #FDBA74;
}
.kpi.hl .v{color:var(--brand-d)}
.kpi.click{cursor:pointer;transition:transform .16s ease, box-shadow .16s ease}
.kpi.click:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi.sel{border:2px solid var(--brand)}

/* Badges */
.bdg{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.bdg.buy{background:var(--warn-soft);color:var(--warn)}
.bdg.ship{background:var(--info-soft);color:var(--info)}
.bdg.done{background:var(--ok-soft);color:var(--ok)}
.bdg.loc{background:var(--brand-soft);color:var(--brand-d)}
.bdg.exp{background:var(--surface-2);color:var(--muted)}
.bdg.recv{background:var(--ok-soft);color:var(--ok)}
.bdg.bad{background:var(--bad-soft);color:var(--bad)}

/* Modern Table */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{font-size:13px;color:var(--muted);font-weight:700;text-align:start;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer;transition:background-color .15s ease}
.tbl tr.click:hover td{background:var(--brand-softer)}
.tblwrap{overflow-x:auto}
.empty{padding:48px 24px;text-align:center;color:var(--muted);font-size:15px}

/* Modern Inputs & Tabs */
.tabs{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:3px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted);font-size:13.5px;transition:all .15s ease}
.tabs button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow-sm)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;width:100%;outline:none;transition:border-color .15s ease, box-shadow .15s ease}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(234, 88, 12, 0.15)}
.search{max-width:320px}

/* Stepper Bar */
.steps{display:flex;gap:0;overflow-x:auto;padding:10px 0}
.step{flex:1;min-width:96px;text-align:center;cursor:pointer;position:relative;padding-top:32px;font-size:13px;font-weight:700;color:var(--muted);transition:color .15s ease}
.step::before{content:"";position:absolute;top:12px;left:50%;width:100%;height:3px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step .dot{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--line);z-index:1;transition:all .2s ease}
.step.past .dot,.step.cur .dot{background:var(--brand);border-color:var(--brand)}
.step.past::before,.step.cur::before{background:var(--brand)}
.step.cur{color:var(--brand-d);font-weight:800}
.step.cur .dot{box-shadow:0 0 0 4px rgba(234, 88, 12, 0.25)}

/* Stages Comparison */
.stages{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
.stage{overflow:hidden}
.stage .top{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.stage.current .top{background:linear-gradient(145deg, #FFF7ED, #FFEDD5);border-bottom-color:#FED7AA}
.stage.current{border-color:#FDBA74}
.stage .n{width:30px;height:30px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.stage.dim .n{background:#CBD5E1}
.stage .body{padding:16px 20px 20px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14.5px}
.ln.sub{color:var(--muted);font-size:13.5px;padding-right:12px}
.ln.tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;font-weight:800}
.ln.rem{font-size:18px;font-weight:900}
.ln.rem.zero{color:var(--ok)}
.ln.rem.due{color:var(--bad)}
.sec{font-size:12.5px;font-weight:800;color:var(--brand-d);margin:14px 0 4px;text-transform:uppercase;letter-spacing:0.5px}

.profit{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--brand-softer);border:1px solid #FED7AA}
.profit.recv{background:var(--ok-soft);border-color:#A7F3D0}
.profit.loss{background:var(--bad-soft);border-color:#FECDD3}
.profit .pv{font-size:22px;font-weight:900}
.ppos{color:var(--ok)} .pneg{color:var(--bad)}
.ptot{font-size:17px;font-weight:900;line-height:1.2}
.pchips{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--ok-soft);color:#065F46}
.pchip.pneg{background:var(--bad-soft);color:var(--bad)}
.pchip i{font-style:normal;font-weight:600;font-size:11.5px;opacity:.8;min-width:28px}
.pchipc{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--pc);vertical-align:-1px}

/* Container Grouping */
.gport{margin-bottom:18px;overflow:hidden;border-top:4px solid var(--pc)}
.gph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 10%,#fff),#fff)}
.gst{padding:10px 20px 4px;font-weight:800;color:var(--muted);font-size:14px;border-top:1px solid var(--line-2)}
.gcars{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;padding:10px 20px 18px}
.gcar{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);cursor:pointer;background:var(--surface);transition:all .15s ease}
.gcar:hover{border-color:var(--brand);background:var(--brand-softer);transform:translateY(-1px)}
.gtx{flex:1;min-width:0;line-height:1.45} .gtx b{display:block}

/* Detail & Modal */
.chead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 24px}
.info .l{font-size:12.5px;color:var(--muted);font-weight:700}
.info .v{font-weight:700;word-break:break-word}
.mbg{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:580px;box-shadow:var(--shadow-lg);overflow:hidden}
.modal.wide{max-width:920px}
.modal .mh{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal .mb{padding:20px 24px}
.modal .mf{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;background:var(--surface-2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.f label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f.full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-weight:800;color:var(--brand-d);border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:8px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice label{border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:all .15s ease}
.choice label:has(input:checked){border-color:var(--brand);background:var(--brand-softer)}
.big{border:1.5px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;background:var(--surface);text-align:start;transition:all .15s ease}
.big:hover{border-color:var(--brand);background:var(--brand-softer)}

/* Toast & Login */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 24px;border-radius:12px;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
#toast.on{opacity:1}
#login{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at center, #FFF7ED 0%, #F8FAFC 70%);display:none;align-items:center;justify-content:center;padding:16px}
#login.on{display:flex}
#login .box{width:100%;max-width:400px;padding:32px;border-radius:20px;box-shadow:var(--shadow-lg)}
#login .logo{justify-content:center;margin-bottom:8px;font-size:22px}
#login .err{color:var(--bad);font-size:13px;min-height:22px;margin-top:8px}

/* Map Grid */
.mapgrid{display:grid;grid-template-columns:1fr 380px;gap:20px}
.map svg{width:100%;height:auto;display:block}
.map path{stroke:#fff;stroke-width:.8;cursor:pointer;transition:opacity .15s}
.map path:hover{opacity:.8}
.map path.sel{stroke:#0F172A;stroke-width:2.5}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* Car Photos */
.carcell{display:flex;align-items:center;gap:12px}
.thumb{width:68px;height:50px;border-radius:10px;object-fit:cover;background:var(--brand-soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
.carinfo{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block;background:var(--brand-soft)}
.gal{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.gal img{width:68px;height:50px;object-fit:cover;border-radius:8px;cursor:pointer;flex:none;border:1.5px solid transparent;transition:all .15s ease}
.gal img:hover{border-color:var(--brand);transform:scale(1.04)}

@media (max-width:900px){
  .stages,.mapgrid,.carinfo{grid-template-columns:1fr}
  .grid.g3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .grid,.grid.g3,.choice{grid-template-columns:1fr}
}
@media print{
  body{background:#fff}
  body > *:not(#print){display:none !important}
  #print{display:block;padding:10px;font-size:13px}
  #print table{width:100%;border-collapse:collapse;margin:8px 0}
  #print td,#print th{border:1px solid #ccc;padding:6px 8px;text-align:start}
  #print th{background:#f6f0ea}
  #print h1{color:#C2570C}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><img src="logo.png" alt="AWS"><span id="officeName">مكتب السيارات</span></div>
  <button class="newcar" onclick="carForm()" title="سيارة جديدة">＋ <b>سيارة جديدة</b></button>
  <div class="navlbl">القائمة</div>
  <nav id="nav">
    <a data-v="cars"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg></span>السيارات</a>
    <a data-v="customers"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>الزبائن</a>
    <a data-v="profits"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span>الأرباح</a>

<script>
/* ===================== data ===================== */
const KEY = 'car_office_v1';
const P = window.AWS_PORTS || {ports:[], yards:[], states:[], markup:{tow:0, ocean_per_car:0}};
const LOC = ['تم الشراء','تم السداد','نقل داخلي','مستودع','في البحر','وصلت','تسلمت'];
const STG = {buy:'شراء', ship:'شحن', done:'مكتملة'};
const STGN = {buy:'المرحلة 1: الشراء', ship:'المرحلة 2: الشحن'};
const METHODS = ['نقدي','حوالة مصرفية','تحويل','صك','أخرى'];
const PORT_COLORS = {SAV:'#F97316',HOU:'#EAB308',NYC:'#3B82F6',CHI:'#8B5CF6',LAX:'#10B981',SEA:'#14B8A6',HNL:'#EC4899'};

let db = load();
let ui = {view:'cars', carId:null, filter:'all', q:'', month:thisMonth(), allMonths:false, drill:'recv', mapState:null};

function load(){
  let d; try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  d = d || {};
  d.cars = d.cars || [];
  d.customers = d.customers || [];
  d.settings = Object.assign({officeName:'AWS COMPANY', officeFee:0, wirePct:1.5, perContainer:4}, d.settings||{});
  return d;
}
const FBC = window.FIREBASE_CONFIG || {};
const USE_FB = !!(window.firebase && FBC.apiKey && !/PASTE|ضع/.test(FBC.apiKey));
let fs = null, fbAuth = null, unsub = [];
const plain = o => JSON.parse(JSON.stringify(o));
function fbErr(e){ console.error(e); toast('تعذر الحفظ في السحابة: ' + (e.code || e.message)); }
function save(c){
  if(!USE_FB){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('تعذر الحفظ في المتصفح!'); } return; }
  if(c){ logCar(shadow.cars[c.id], c); fs.collection('cars').doc(c.id).set(plain(c)).catch(fbErr); }
}
function saveSettingsStore(){ if(USE_FB){ logSettings(); fs.collection('meta').doc('settings').set(plain(db.settings)).catch(fbErr); } else save(); }
function removeCar(id){ const old = shadow.cars[id]; db.cars = db.cars.filter(c => c.id !== id); if(USE_FB){ if(old) addLog('car', id, carName(old), 'حذف', [`حذف السيارة${old.vin ? ' — ' + old.vin : ''}${old.customer ? ' — ' + old.customer : ''}`]); fs.collection('cars').doc(id).delete().catch(fbErr); } else save(); }
function saveCust(cu){ if(!USE_FB) return save(); logCust(shadow.customers[cu.id], cu); fs.collection('customers').doc(cu.id).set(plain(cu)).catch(fbErr); }
function saveContainer(ct, changes){
  if(!USE_FB) return save();
  if(changes && changes.length) addLog('container', ct.id, 'حاوية ' + (ct.no || ''), shadow.containers && shadow.containers[ct.id] ? 'تعديل' : 'إضافة', changes);
  fs.collection('containers').doc(ct.id).set(plain(ct)).catch(fbErr);
}
function removeCust(id){ const old = shadow.customers[id]; db.customers = db.customers.filter(x => x.id !== id); if(USE_FB){ if(old) addLog('customer', id, old.name, 'حذف', ['حذف الزبون']); fs.collection('customers').doc(id).delete().catch(fbErr); } else save(); }

const shadow = {cars:{}, customers:{}, containers:{}, settings:null};
const $t = n => '$' + r2(n).toLocaleString('en-US', {maximumFractionDigits:2});
function addLog(kind, ref, title, action, changes){
  if(!USE_FB || !fbAuth || !fbAuth.currentUser || !changes.length) return;
  fs.collection('log').add({at:new Date().toISOString(), by:fbAuth.currentUser.email || '', kind, ref, title:title || '', action, changes}).catch(e => console.error('log', e));
}
const CAR_F = {customer:'الزبون', vin:'رقم الهيكل', year:'السنة', make:'النوع', lot:'رقم اللوت', auction:'المزاد', date:'تاريخ الشراء',
  buyPrice:'سعر الشراء', auctionFees:'رسوم المزاد', officeFee:'عمولة المكتب', wirePct:'عمولة الحوالة %', yard:'الساحة', port:'ميناء الساحة',
  relocPort:'نقل لميناء آخر', perContainer:'سيارات في الحاوية', towCharge:'السحب على الزبون', oceanCharge:'البحري على الزبون',
  shipWirePct:'عمولة حوالة الشحن %', towCost:'السحب الفعلي', oceanCost:'البحري الفعلي', notes:'الملاحظات', img:'الصورة', link:'رابط السيارة',
  loc:'المكان', stage:'المرحلة', lock1:'قفل المرحلة 1', lock2:'قفل المرحلة 2', manualShip:'نقل يدوي للشحن', containerNo:'رقم الحاوية', booking:'رقم الحجز'};
const MONEY_F = new Set(['buyPrice','auctionFees','officeFee','towCharge','oceanCharge','towCost','oceanCost']);
function fmtF(k, v){
  if(v === '' || v == null || v === false) return '—';
  if(k === 'loc') return LOC[v] || v;
  if(k === 'stage') return STG[v] || v;
  if(k === 'yard') return P.yards[v] ? P.yards[v].n + ', ' + P.yards[v].s : v;
  if(k === 'port' || k === 'relocPort') return pName(v);
  if(k === 'img') return 'صورة';
  if(k === 'manualShip') return 'نعم';
  if(MONEY_F.has(k)) return $t(v);
  if(k === 'notes' || k === 'link') return String(v).slice(0, 40) + (String(v).length > 40 ? '…' : '');
  return String(v);
}
const who = p => p === 'office' ? 'على المكتب' : 'على الزبون';
function diffList(a, b, label, describe, fields){
  const out = [], A = new Map((a || []).map(x => [x.id, x])), B = new Map((b || []).map(x => [x.id, x]));
  B.forEach((x, id) => { if(!A.has(id)) out.push(`${label} جديد${label === 'دفعة' ? 'ة' : ''}: ${describe(x)}`); });
  A.forEach((x, id) => { if(!B.has(id)) out.push(`حذف ${label}: ${describe(x)}`); });
  B.forEach((x, id) => { const o = A.get(id); if(!o) return;
    const ch = fields.filter(([f]) => String(o[f] ?? '') !== String(x[f] ?? '')).map(([f, n, fm]) => `${n}: ${fm ? fm(o[f]) : (o[f] || '—')} ← ${fm ? fm(x[f]) : (x[f] || '—')}`);
    if(ch.length) out.push(`تعديل ${label} (${describe(o)}): ${ch.join('، ')}`);
  });
  return out;
}
function logCar(o, c){
  if(!o){ addLog('car', c.id, carName(c), 'إضافة', [`سيارة جديدة${c.vin ? ' — ' + c.vin : ''}${c.customer ? ' — الزبون ' + c.customer : ''}`]); return; }
  const ch = [];
  Object.keys(CAR_F).forEach(k => { if(String(o[k] ?? '') !== String(c[k] ?? '') && !(o[k] == null && (c[k] === '' || c[k] === false)) && !(c[k] == null && (o[k] === '' || o[k] === false)))
    ch.push(`${CAR_F[k]}: ${fmtF(k, o[k])} ← ${fmtF(k, c[k])}`); });
  const ap = x => x ? `${x.by === 'office' ? 'المكتب' : 'الزبون'} ${x.date || ''}` : '—';
  if(JSON.stringify(o.auctionPaid || null) !== JSON.stringify(c.auctionPaid || null)) ch.push(`سداد المزاد: ${ap(o.auctionPaid)} ← ${ap(c.auctionPaid)}`);
  ch.push(...diffList(o.payments, c.payments, 'دفعة', p => `${$t(p.amount)} — ${STG[p.stage] || ''} — ${p.date || ''}`,
    [['amount','المبلغ',$t], ['date','التاريخ'], ['stage','المرحلة',v => STG[v] || v], ['method','الطريقة']]));
  ch.push(...diffList(o.expenses, c.expenses, 'مصروف', e => `${e.desc || 'مصروف'} ${$t(e.amount)} (${who(e.payer)})`,
    [['desc','الوصف'], ['amount','المبلغ',$t], ['payer','على مين',who], ['stage','المرحلة',v => STG[v] || v], ['date','التاريخ']]));
  ch.push(...diffList(o.refunds, c.refunds, 'مبلغ راجع', r => `${$t(r.amount)}${r.returned ? ' (رجع)' : ''}`, [['amount','المبلغ',$t], ['returned','رجع للزبون']]));
  addLog('car', c.id, carName(c), 'تعديل', ch);
}
function logCust(o, cu){
  if(!o){ addLog('customer', cu.id, cu.name, 'إضافة', ['زبون جديد' + (cu.phone ? ' — ' + cu.phone : '')]); return; }
  const F = {name:'الاسم', phone:'الهاتف', phone2:'هاتف ثاني', city:'المدينة', notes:'ملاحظات'};
  addLog('customer', cu.id, cu.name, 'تعديل', Object.keys(F).filter(k => String(o[k] ?? '') !== String(cu[k] ?? '')).map(k => `${F[k]}: ${o[k] || '—'} ← ${cu[k] || '—'}`));
}
function logSettings(){
  const o = shadow.settings || {}, s = db.settings, F = {officeName:'اسم المكتب', officeFee:'عمولة المكتب الافتراضية', wirePct:'عمولة الحوالة الافتراضية %', perContainer:'سيارات في الحاوية'};
  addLog('settings', 'settings', 'الإعدادات', 'تعديل', Object.keys(F).filter(k => String(o[k] ?? '') !== String(s[k] ?? '')).map(k => `${F[k]}: ${o[k] ?? '—'} ← ${s[k] ?? '—'}`));
}
async function replaceAll(d){
  if(!USE_FB){ localStorage.setItem(KEY, JSON.stringify(d)); db = load(); return; }
  const ops = [];
  for(const col of ['cars','customers']){ (await fs.collection(col).get()).forEach(doc => ops.push(b => b.delete(doc.ref))); }
  d.cars.forEach(c => ops.push(b => b.set(fs.collection('cars').doc(c.id), plain(c))));
  (d.customers || []).forEach(cu => ops.push(b => b.set(fs.collection('customers').doc(cu.id), plain(cu))));
  if(d.settings) ops.push(b => b.set(fs.collection('meta').doc('settings'), plain(d.settings)));
  for(let i = 0; i < ops.length; i += 400){ const b = fs.batch(); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); }
}
function setCloud(t){ const el = $('#cloud'); if(el) el.innerHTML = t; }

function initFirebase(){
  firebase.initializeApp(FBC);
  fbAuth = firebase.auth(); fs = firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(() => {});
  db = {cars:[], customers:[], settings:load().settings};
  fbAuth.onAuthStateChanged(user => {
    unsub.forEach(f => f()); unsub = [];
    if(!user){ $('#login').classList.add('on'); setCloud(''); return; }
    $('#login').classList.remove('on');
    setCloud(`<span class="em" title="${esc(user.email)}">${esc(user.email)}</span>
      <button class="sbtn out" onclick="fbAuth.signOut()"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg></span>خروج</button>`);
    let first = true;
    unsub.push(fs.collection('cars').onSnapshot(snap => {
      db.cars = snap.docs.map(d => Object.assign({expenses:[], payments:[], refunds:[]}, d.data()));
      shadow.cars = Object.fromEntries(snap.docs.map(d => [d.id, Object.assign({expenses:[], payments:[], refunds:[]}, d.data())]));
      render();
      clearTimeout(syncTracking._t); syncTracking._t = setTimeout(syncTracking, 1500);
      if(first){ first = false; offerUpload(snap.empty); }
    }, fbErr));
    unsub.push(fs.collection('customers').onSnapshot(snap => { db.customers = snap.docs.map(d => d.data()); shadow.customers = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); render(); }, fbErr));
    unsub.push(fs.collection('meta').doc('settings').onSnapshot(d => { if(d.exists){ db.settings = Object.assign(db.settings, d.data()); shadow.settings = d.data(); render(); } }, fbErr));
    unsub.push(fs.collection('containers').onSnapshot(snap => {
      db.containers = snap.docs.map(d => d.data()); shadow.containers = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); render();
    }, e => console.error('containers', e)));
    unsub.push(fs.collection('log').orderBy('at', 'desc').limit(500).onSnapshot(snap => {
      db.log = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      if(ui.view === 'log' || ui.view === 'car' || ui.view === 'customer') render();
    }, e => console.error('log', e)));
  });
}
function doLogin(){
  const btn = $('#lgBtn'); btn.disabled = true; $('#lgErr').textContent = '';
  fbAuth.signInWithEmailAndPassword($('#lgEmail').value.trim(), $('#lgPass').value)
    .catch(e => { $('#lgErr').textContent = /invalid|wrong|not-found/.test(e.code) ? 'البريد أو كلمة المرور غير صحيحة' : 'تعذر الدخول: ' + e.code; })
    .finally(() => btn.disabled = false);
}
function offerUpload(cloudEmpty){
  let local; try{ local = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!cloudEmpty || !local || !local.cars || !local.cars.length) return;
  ask(`فيه ${local.cars.length} سيارة محفوظة في هذا المتصفح من قبل. نرفعهم لـ Firebase؟`, () => {
    replaceAll(local).then(() => { localStorage.removeItem(KEY); toast('تم رفع البيانات للسحابة'); }).catch(fbErr);
  }, 'رفع');
}

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const r2 = n => Math.round(+((+n || 0) * 100).toFixed(6)) / 100;
const N = v => (v === '' || v == null || isNaN(+v)) ? 0 : +v;
function today(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function thisMonth(){ return today().slice(0,7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){
  n = r2(n); const neg = n < 0;
  const s = '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
  return `<span class="num">${neg ? '−' : ''}${s}</span>`;
}
function dt(s){ return `<span class="num">${esc(s)}</span>`; }
function monthName(m){ if(!m) return ''; const [y,mm] = m.split('-'); return new Date(+y, +mm-1, 1).toLocaleDateString('ar-LY-u-nu-latn', {month:'long', year:'numeric'}); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }
function carName(c){ return [c.year, c.make].filter(Boolean).join(' ') || 'سيارة بدون اسم'; }
function getCar(id){ return db.cars.find(c => c.id === id); }
function expLabel(e){ return e.kind === 'fine' ? 'غرامة' : 'مصروف'; }
function getCust(id){ return db.customers.find(x => x.id === id); }
function carThumb(c){ return c.img ? `<img class="thumb" src="${esc(c.img)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;thumb&quot;>🚗</div>'">` : `<div class="thumb">🚗</div>`; }
function portById(id){ return P.ports.find(p => p.id === id); }
function yardLabel(y){ return `${y.n}, ${y.s} — ${y.a}`; }
const YARD_IDX = {}; P.yards.forEach((y,i) => YARD_IDX[yardLabel(y)] = i);

function quote(yi, pid, k){
  const y = P.yards[yi], res = {};
  if(y){ res.towCost = y.tow; res.towCharge = y.tow == null ? null : y.tow + (P.markup.tow||0); }
  const port = portById(pid || (y && y.p));
  if(port && port.ocean[k]){ const per = port.ocean[k] / k; res.oceanCost = r2(per); res.oceanCharge = r2(per + (P.markup.ocean_per_car||0)); }
  return res;
}

/* ===================== financial engine ===================== */
function calc(c){
  const ex = (payer, st) => c.expenses.filter(e => e.payer === payer && e.stage === st).reduce((s,e) => s + N(e.amount), 0);
  const pay = st => c.payments.filter(p => p.stage === st).reduce((s,p) => s + N(p.amount), 0);
  const base = N(c.buyPrice) + N(c.auctionFees);
  const wire = r2(base * N(c.wirePct) / 100);
  const custExp1 = ex('customer','buy'), offExp1 = ex('office','buy');
  const req1 = r2(base + N(c.officeFee) + wire + custExp1);
  const auctionByCust = c.auctionPaid && c.auctionPaid.by === 'customer' ? base : 0;
  const payments1 = pay('buy');
  const paid1 = r2(payments1 + auctionByCust);
  const rem1 = r2(req1 - paid1);
  const profit1 = r2(N(c.officeFee) + wire - offExp1);

  const custExp2 = ex('customer','ship'), offExp2 = ex('office','ship');
  const shipCharge = N(c.towCharge) + N(c.oceanCharge);
  const wire2 = r2((shipCharge + custExp2) * N(c.shipWirePct) / 100);
  const req2 = r2(shipCharge + custExp2 + wire2);
  const paid2 = r2(pay('ship'));
  const rem2 = r2(req2 - paid2);
  const actual = N(c.towCost) + N(c.oceanCost);
  const profit2 = r2(shipCharge + wire2 - actual - offExp2);

  const advance = (c.auctionPaid && c.auctionPaid.by === 'office' && !c.lock1) ? Math.min(base, Math.max(rem1,0)) : 0;
  const refundDue = r2((c.refunds||[]).filter(x => !x.returned).reduce((s,x) => s + N(x.amount), 0));
  return {base, wire, custExp1, offExp1, req1, auctionByCust, payments1, paid1, rem1, profit1,
          custExp2, offExp2, shipCharge, wire2, req2, paid2, rem2, actual, profit2, advance, refundDue};
}

function sync(c){
  const k = calc(c), EPS = 0.004;
  if(!c.lock1 && k.req1 > 0 && k.rem1 <= EPS) c.lock1 = today();
  else if(c.lock1 && k.rem1 > EPS) c.lock1 = null;

  if(!c.lock2 && k.req2 > 0 && k.rem2 <= EPS && c.stage !== 'buy') c.lock2 = today();
  else if(c.lock2 && k.rem2 > EPS) c.lock2 = null;

  if(c.lock1 && c.stage === 'buy') c.stage = 'ship';
  if(!c.lock2 && k.req2 > 0 && k.rem2 <= EPS && c.stage === 'ship') c.lock2 = today();

  if(c.lock1 && c.lock2) c.stage = 'done';
  else if(c.stage === 'done') c.stage = 'ship';
  if(c.stage === 'ship' && !c.lock1 && !c.manualShip) c.stage = 'buy';
}
function commit(c){ if(c) sync(c); save(c); render(); }

function ctMath(ct){
  const cars = ctCars(ct), Y = cars.length, p = portById(ct.port), oc = p ? p.ocean : {};

  const listY = oc[Math.min(4, Math.max(2, Y))] || 0;
  const actual = ct.cost !== '' && ct.cost != null ? N(ct.cost) : (Y ? listY : 0);
  return {cars, Y, X, expected, actual, real:ct.cost !== '' && ct.cost != null, loss:r2(actual - expected),

}

function ctLoc(id, i){
  const ct = getCt(id), cars = ctCars(ct); if(ct.loc === i) return;
  ask(`تغيير مرحلة الحاوية إلى <b>${LOC[i]}</b>؟ تتغير معاها ${cars.length} سيارة.`, () => {
    const old = ct.loc; ct.loc = i;
    if(i === 4 && !ct.shipDate) ct.shipDate = today();
    cars.forEach(c => { c.loc = i; c.locAt = Object.assign({}, c.locAt, {[i]: today()}); sync(c); save(c); });
    saveContainer(ct, [`المرحلة: ${old != null ? LOC[old] : '—'} ← ${LOC[i]}`]); render(); toast('تم تحديث المرحلة');
  }, 'تغيير');
}
function ctSetCost(id){
  const ct = getCt(id), cars = ctCars(ct), v = $('#ctCost').value;
  if(v === '' || !cars.length) return toast(cars.length ? 'اكتب التكلفة' : 'الحاوية فاضية');
  const tot = r2(N(v)), each = r2(tot / cars.length); let left = tot;
  const old = ct.cost; ct.cost = tot; ct.shares = {};
  cars.forEach((c, i) => { const s = i === cars.length - 1 ? r2(left) : each; left = r2(left - s); c.oceanCost = s; c.oceanActual = true; sync(c); save(c); });
  saveContainer(ct, [`التكلفة الفعلية: ${old !== '' && old != null ? $t(old) : '—'} ← ${$t(tot)}`]); render(); toast('تم التقسيم');
}
function ctSaveShares(id){
  const ct = getCt(id), ch = []; ct.shares = ct.shares || {};
  document.querySelectorAll('.shin').forEach(inp => { const c = getCar(inp.dataset.id); if(!c || inp.value === '') return;
    const v = r2(N(inp.value)); if(r2(N(c.oceanCost)) === v) return;
    ch.push(`${carName(c)}: ${$t(c.oceanCost)} ← ${$t(v)}`); c.oceanCost = v; c.oceanActual = true; ct.shares[c.id] = v; sync(c); save(c); });
  if(!ch.length) return toast('ما فيش تغيير');
  saveContainer(ct, ch); render(); toast('تم حفظ الأنصبة');
}
function ctRemove(id, cid){
  const ct = getCt(id), c = getCar(cid);
  ask(`شيل ${esc(carName(c))} من الحاوية؟`, () => { c.containerId = null; c.containerNo = ''; c.booking = ''; if(ct.shares) delete ct.shares[cid];
    save(c); saveContainer(ct, [`شيل سيارة: ${carName(c)}`]); render(); }, 'شيل');
}
function ctDelete(id){
  const ct = getCt(id), cars = ctCars(ct);
  ask(`حذف الحاوية ${esc(ct.no)}؟`, () => {
    cars.forEach(c => { c.containerId = null; c.containerNo = ''; c.booking = ''; save(c); });
    addLog('container', id, 'حاوية ' + ct.no, 'حذف', ['حذف الحاوية']);
    db.containers = db.containers.filter(x => x.id !== id); fs.collection('containers').doc(id).delete().catch(fbErr); go('containers');
  }, 'حذف');
}

    <td>${c.stage === 'done' ? '<span class="muted">—</span>' : `<b style="color:${cur > 0 ? 'var(--bad)' : 'var(--ok)'}">${money(cur)}</b>`}
        ${debt1 ? `<div class="small" style="color:var(--bad)">+ دين الشراء ${money(k.rem1)}</div>` : ''}</td>
    <td class="pcell"><div class="ptot ${pcls(k.profit1 + k.profit2)}">${money(k.profit1 + k.profit2)}</div>

  </tr>`;
}
const pcls = n => n < 0 ? 'pneg' : 'ppos';

function custStats(cu){
  const cars = db.cars.filter(c => c.customerId === cu.id);
  let due1 = 0, due2 = 0, refund = 0, active = 0;
  cars.forEach(c => { const k = calc(c); due1 += Math.max(k.rem1,0); due2 += c.stage !== 'buy' ? Math.max(k.rem2,0) : 0; refund += k.refundDue; if(c.stage !== 'done') active++; });
  return {cars, due:r2(due1 + due2), due1:r2(due1), due2:r2(due2), refund, active};
}
function duePills(s){
  const p = (t, v) => `<span class="pchip ${v > 0.009 ? 'pneg' : 'ppos'}"><i>${t}</i>${v > 0.009 ? money(v) : 'خالص ✓'}</span>`;
  return `<div class="pchips">${p('شراء', s.due1)}${p('شحن', s.due2)}</div>`;
}

function saveCustForm(id){

function viewCar(c){
  const k = calc(c);
  const y = P.yards[c.yard], port = portById(c.relocPort || c.port);
  const isCur1 = c.stage === 'buy', isCur2 = c.stage === 'ship';
  const exp1c = c.expenses.filter(e => e.stage === 'buy' && e.payer === 'customer');
  const exp2c = c.expenses.filter(e => e.stage === 'ship' && e.payer === 'customer');

  const s1status = c.lock1 ? `<span class="bdg done">✓ اكتملت ${dt(c.lock1)}</span>` : isCur1 ? `<span class="bdg buy">المرحلة الحالية</span>` : `<span class="bdg bad">فيها باقي</span>`;
  const s2status = c.lock2 ? `<span class="bdg done">✓ اكتملت ${dt(c.lock2)}</span>` : isCur2 ? `<span class="bdg ship">المرحلة الحالية</span>` : `<span class="bdg exp">لم تبدأ</span>`;

  const stage1 = `
  <div class="card stage ${isCur1 ? 'current' : ''}">
    <div class="top"><div class="n">1</div><h3>الشراء</h3><div class="sp"></div>${s1status}</div>
    <div class="body">
      <div class="sec">المطلوب من الزبون</div>
      ${ln('سعر الشراء في المزاد', money(c.buyPrice))}
      ${ln('رسوم المزاد', money(c.auctionFees))}
      ${ln('عمولة المكتب', money(c.officeFee))}
      ${ln(`عمولة الحوالة (<span class="num">${+N(c.wirePct).toFixed(2)}%</span>)`, money(k.wire))}
      ${exp1c.map(e => ln(`${expLabel(e)}: ${esc(e.desc)}`, money(e.amount), 'sub')).join('')}
      ${ln('إجمالي المطلوب', money(k.req1), 'tot')}
      ${ln('دفعات الزبون', money(k.payments1))}
      ${ln('الباقي', money(k.rem1), 'rem ' + (k.rem1 > 0 ? 'due' : 'zero'))}
      <div class="profit ${k.profit1 < 0 ? 'loss' : c.lock1 ? 'recv' : ''}">
        <div class="row"><span class="small muted" style="font-weight:700">مكسب المرحلة 1</span><div class="sp"></div>
          ${c.lock1 ? `<span class="bdg recv">مستلم</span>` : `<span class="bdg exp">متوقع</span>`}</div>
        <div class="pv ${pcls(k.profit1)}">${money(k.profit1)}</div>
      </div>
    </div>
  </div>`;

  const stage2 = `
  <div class="card stage ${isCur2 ? 'current' : ''} ${c.stage === 'buy' ? 'dim' : ''}">
    <div class="top"><div class="n">2</div><h3>الشحن</h3><div class="sp"></div>${s2status}</div>
    <div class="body">
      <div class="sec">المطلوب من الزبون</div>
      ${ln('السحب الداخلي', money(c.towCharge))}
      ${ln('الشحن البحري', money(c.oceanCharge))}
      ${exp2c.map(e => ln(`${expLabel(e)}: ${esc(e.desc)}`, money(e.amount), 'sub')).join('')}
      ${ln('إجمالي المطلوب', money(k.req2), 'tot')}
      ${ln('دفعات الزبون', money(k.paid2))}
      ${ln('الباقي', money(k.rem2), 'rem ' + (k.rem2 > 0 ? 'due' : 'zero'))}
      <div class="profit ${k.profit2 < 0 ? 'loss' : c.lock2 ? 'recv' : ''}">
        <div class="row"><span class="small muted" style="font-weight:700">مكسب المرحلة 2</span><div class="sp"></div>
          ${c.lock2 ? `<span class="bdg recv">مستلم</span>` : `<span class="bdg exp">متوقع</span>`}</div>
        <div class="pv ${pcls(k.profit2)}">${money(k.profit2)}</div>
      </div>
    </div>
  </div>`;

  return `
  <div class="chead">
    <button class="btn" onclick="go('cars')">→ رجوع</button>
    <div style="flex:1;min-width:220px">
      <h1>${esc(carName(c))}</h1>
      <div class="muted">${esc(c.customer || 'بدون زبون')}</div>
    </div>
    <div class="actions">
      <button class="btn pri" onclick="paymentForm('${c.id}')">＋ دفعة من الزبون</button>
      <button class="btn" onclick="expenseForm('${c.id}')">＋ مصروف</button>
      <button class="btn" onclick="printInvoice('${c.id}')">🧾 فاتورة</button>
      <button class="btn" onclick="carForm('${c.id}')">تعديل</button>
      <button class="btn danger" onclick="delCar('${c.id}')">حذف</button>
    </div>
  </div>

  <div class="card pad" style="margin-bottom:16px">
    <div class="row" style="margin-bottom:8px"><h3>مكان السيارة</h3></div>
    <div class="steps">${LOC.map((l,i) => `<div class="step ${i < (c.loc||0) ? 'past' : i === (c.loc||0) ? 'cur' : ''}" onclick="setLoc('${c.id}',${i})"><span class="dot"></span>${l}</div>`).join('')}</div>
  </div>

  <div class="stages">${stage1}${stage2}</div>`;
}

function viewProfits(){
  const all = profitRows(), m = ui.allMonths ? '' : ui.month;
  const recv = all.filter(r => r.date && (!m || r.date.startsWith(m)));
  const sum = a => a.reduce((s,r) => s + r.amount, 0);
  return `
  <div class="row" style="margin-bottom:16px">
    <h1>الأرباح</h1><div class="sp"></div>
    <input type="month" class="inp" style="width:auto" value="${ui.month}" onchange="ui.month=this.value||thisMonth();render()">
  </div>
  <div class="kpis">
    <div class="card kpi hl"><div class="l">مكسب مستلم</div><div class="v">${money(sum(recv))}</div></div>
  </div>`;
}
function profitRows(){
  const rows = [];
  db.cars.forEach(c => { const k = calc(c);
    rows.push({c, stage:'buy', amount:k.profit1, date:c.lock1});
    rows.push({c, stage:'ship', amount:k.profit2, date:c.lock2});
  });
  return rows;
}

function viewMap(){
  return `<div class="row" style="margin-bottom:14px"><h1>خريطة المواني</h1></div>
  <div class="card pad empty">خريطة الموانئ وأسعار النقل الداخلي</div>`;
}

function openModal(title, body, foot, wide){
  $('#modalRoot').innerHTML = `<div class="mbg" onmousedown="if(event.target===this)closeModal()">
    <div class="modal ${wide ? 'wide' : ''}"><div class="mh"><h2>${title}</h2><div class="sp"></div><button class="btn ghost sm" onclick="closeModal()">✕</button></div>
    <div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div></div>`;
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
function ask(msg, yes, label='تأكيد'){
  window._ask = yes;
  openModal('تأكيد', `<div>${msg}</div>`, `<button class="btn pri" onclick="closeModal();window._ask()">${label}</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
const fld = (label, name, val, type='text', extra='', cls='') => `<div class="f ${cls}"><label>${label}</label><input class="inp" name="${name}" type="${type}" value="${esc(val ?? '')}" ${type === 'number' ? 'step="any"' : ''} ${extra}></div>`;
const formData = id => Object.fromEntries(new FormData(document.getElementById(id)).entries());

function carForm(id, custId){
  const s = db.settings;
  const c = id ? getCar(id) : {date:today(), wirePct:s.wirePct, officeFee:s.officeFee, perContainer:s.perContainer, auction:'Copart', customerId:custId||''};
  openModal(id ? 'تعديل السيارة' : 'سيارة جديدة', `<form id="cf" class="grid g3" onsubmit="event.preventDefault();saveCar('${id||''}')">
    <div class="fsec">السيارة</div>
    ${fld('السنة','year',c.year,'text','placeholder="2021"')}
    ${fld('النوع والموديل','make',c.make,'text','placeholder="Toyota Camry"')}
    ${fld('رقم الهيكل','vin',c.vin,'text')}
    <div class="fsec">الماليات</div>
    ${fld('سعر الشراء ($)','buyPrice',c.buyPrice,'number')}
    ${fld('رسوم المزاد ($)','auctionFees',c.auctionFees,'number')}
    ${fld('عمولة المكتب ($)','officeFee',c.officeFee,'number')}
  </form>`, `<button class="btn pri" onclick="document.getElementById('cf').requestSubmit()">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
function saveCar(id){
  const d = formData('cf');
  let c = id ? getCar(id) : null;
  if(c) Object.assign(c, d);
  else { c = Object.assign({id:uid(), created:new Date().toISOString(), stage:'buy', loc:0, expenses:[], payments:[], refunds:[]}, d); db.cars.push(c); }
  closeModal(); commit(c); if(!id) go('car', c.id); toast('تم الحفظ');
}
function delCar(id){ ask('حذف السيارة؟', () => { removeCar(id); go('cars'); toast('تم الحذف'); }, 'حذف'); }
function setLoc(id, i){ const c = getCar(id); c.loc = i; commit(c); }

function paymentForm(id){ toast('نافذة الدفع'); }
function expenseForm(id){ toast('نافذة المصاريف'); }
function printInvoice(id){ window.print(); }
function openSettings(){ toast('نافذة الإعدادات'); }

if(USE_FB) initFirebase(); else render();
</script>
</body>
</html>
