<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS COMPANY</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#FBF6F1; --surface:#FFFFFF; --surface-2:#FFF8F2;
  --ink:#120A04; --muted:#4A3A2D; --line:#E2D2C3; --line-2:#EDE1D5;
  --brand:#E8701A; --brand-d:#C2570C; --brand-soft:#FFEEDF; --brand-softer:#FFF6EE;
  --ok:#2F855A; --ok-soft:#E6F4EC; --bad:#C53030; --bad-soft:#FDECEC;
  --info:#2B6CB0; --info-soft:#E8F1FB; --warn:#A8650B; --warn-soft:#FFF4DC;
  --radius:12px; --shadow:0 1px 2px rgba(80,40,10,.06),0 4px 14px rgba(80,40,10,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Segoe UI Web (West European)",Tahoma,Arial,sans-serif;font-size:14.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

/* header */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:22px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo img{height:36px;width:auto;display:block}
#login .logo img{height:64px}
.pubh .logo img{height:70px}
nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
@media (max-width:1050px){ #cloud .em{display:none} nav a{padding-left:9px;padding-right:9px} }
nav a{padding:20px 12px 18px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--brand-d);border-bottom-color:var(--brand)}
main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--brand-softer);border-color:#F2CFAF}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--brand-softer)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:#F3C2C2}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* cards & layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi.hl{background:linear-gradient(160deg,#FFF3E8,#FFE6D1);border-color:#F6D2B2}
.kpi.hl .v{color:var(--brand-d)}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--brand)}
.kpi.sel{outline:2px solid var(--brand);outline-offset:-1px}

/* badges */
.bdg{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.bdg.buy{background:var(--warn-soft);color:var(--warn)}
.bdg.ship{background:var(--info-soft);color:var(--info)}
.bdg.done{background:var(--ok-soft);color:var(--ok)}
.bdg.loc{background:var(--brand-soft);color:var(--brand-d)}
.bdg.exp{background:#F3EEE9;color:var(--muted)}
.bdg.recv{background:var(--ok-soft);color:var(--ok)}
.bdg.bad{background:var(--bad-soft);color:var(--bad)}

/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:700;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--brand-softer)}
.tblwrap{overflow-x:auto}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* toolbar */
.tabs{display:inline-flex;background:#F4EBE2;border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--brand-d);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;width:100%;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,112,26,.15)}
.search{max-width:300px}

/* car detail */
.chead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 20px}
.info .l{font-size:12px;color:var(--muted);font-weight:600}
.info .v{font-weight:600;word-break:break-word}
.steps{display:flex;gap:0;overflow-x:auto;padding:4px 0}
.step{flex:1;min-width:92px;text-align:center;cursor:pointer;position:relative;padding-top:30px;font-size:12.5px;font-weight:600;color:var(--muted)}
.step::before{content:"";position:absolute;top:11px;left:50%;width:100%;height:3px;background:var(--line)}
.step:first-child::before{display:none}
.step .dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:21px;height:21px;border-radius:50%;background:var(--surface);border:3px solid var(--line);z-index:1}
.step.past .dot,.step.cur .dot{background:var(--brand);border-color:var(--brand)}
.step.past::before,.step.cur::before{background:var(--brand)}
.step.cur{color:var(--brand-d)}
.step.cur .dot{box-shadow:0 0 0 4px rgba(232,112,26,.2)}
.step:hover{color:var(--ink)}
.fin{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fin .s{padding:5px 14px;border-radius:99px;background:#F3EEE9;color:var(--muted);font-weight:700;font-size:13px}
.fin .s.on{background:var(--brand);color:#fff}
.fin .s.ok{background:var(--ok-soft);color:var(--ok)}
.fin .arr{color:#C9B6A5}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
.stage{overflow:hidden}
.stage .top{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.stage.current .top{background:linear-gradient(160deg,#FFF1E4,#FFE7D3)}
.stage.current{border-color:#F3C9A3}
.stage .n{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.stage.dim .n{background:#D8C8BA}
.stage .body{padding:12px 18px 16px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.ln.sub{color:var(--muted);font-size:13px;padding-right:12px}
.ln.tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:9px;font-weight:700}
.ln.rem{font-size:17px;font-weight:700}
.ln.rem.zero{color:var(--ok)}
.ln.rem.due{color:var(--bad)}
.sec{font-size:12px;font-weight:700;color:var(--brand-d);margin:12px 0 2px;letter-spacing:.2px}
.profit{margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--brand-softer);border:1px solid #F6DEC8}
.profit.recv{background:var(--ok-soft);border-color:#C7E6D3}
.profit .pv{font-size:19px;font-weight:700}
.profit.loss{background:var(--bad-soft);border-color:#F3C2C2}
.ppos{color:var(--ok)} .pneg{color:var(--bad)}
.pst{display:flex;gap:8px;justify-content:space-between;max-width:160px;white-space:nowrap}
.pst > span{color:var(--muted)}
.note{padding:10px 13px;border-radius:10px;background:var(--warn-soft);color:#7A4A06;font-size:13px;margin-top:10px}
.note.info{background:var(--info-soft);color:#1E4E80}
.note.bad{background:var(--bad-soft);color:#8B1E1E}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(42,29,19,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;background:var(--surface-2);border-radius:0 0 14px 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f.full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-weight:700;color:var(--brand-d);border-bottom:1px solid var(--line);padding-bottom:5px;margin-top:6px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label{border:2px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.choice label:has(input:checked){border-color:var(--brand);background:var(--brand-softer)}
.choice input{accent-color:var(--brand);margin-top:4px}
.big{border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:var(--surface);text-align:start}
.big:hover{border-color:var(--brand);background:var(--brand-softer)}
.big b{display:block;font-size:16px;margin-bottom:3px}

/* profits */
.bars .br{display:grid;grid-template-columns:90px 1fr 110px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.bars .track{height:12px;background:#F4EBE2;border-radius:99px;overflow:hidden}
.bars .fill{height:100%;background:linear-gradient(90deg,#F59A4A,var(--brand));border-radius:99px}

/* map */
.mapgrid{display:grid;grid-template-columns:1fr 360px;gap:16px}
.map svg{width:100%;height:auto;display:block}
.map path{stroke:#fff;stroke-width:.8;cursor:pointer;transition:opacity .15s}
.map path:hover{opacity:.75}
.map path.sel{stroke:var(--ink);stroke-width:2}
.map text{font-size:9px;fill:#3a2a1d;pointer-events:none;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* car photos */
.carcell{display:flex;align-items:center;gap:10px}
.thumb{width:66px;height:48px;border-radius:8px;object-fit:cover;background:var(--brand-soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
.carinfo{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:var(--brand-soft)}
.gal{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.gal img{width:64px;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;flex:none;border:1px solid var(--line)}
.gal img:hover{outline:2px solid var(--brand)}
.imgprev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgprev img{width:150px;height:104px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--brand-soft)}
.inrow{display:flex;gap:6px;align-items:center}
.inrow .inp{flex:1;min-width:0}
a.lnk{color:var(--brand-d);text-decoration:none;font-weight:600}
a.lnk:hover{text-decoration:underline}
@media (max-width:900px){ .carinfo{grid-template-columns:1fr} }

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
#toast.on{opacity:1}
#print{display:none}
#login{position:fixed;inset:0;z-index:300;background:linear-gradient(160deg,#FFF3E8,#FBF6F1 55%);display:none;align-items:center;justify-content:center;padding:16px}
#login.on{display:flex}
#login .box{width:100%;max-width:380px;padding:28px}
#login .logo{justify-content:center;margin-bottom:6px;font-size:20px}
#login .err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
body.pub header{display:none}
.pubw{max-width:900px;margin:0 auto}
.pubh{text-align:center;margin:10px 0 16px}
.pubh .logo{font-size:22px;margin-bottom:4px}

/* readability: bigger, darker text on screen */
@media screen{
  body{font-size:16.5px}
  .btn.sm{font-size:14.5px}
  h1{font-size:25px} h2{font-size:19px} h3{font-size:17px}
  .small,.tbl th,.f label,.step,.legend{font-size:14px}
  .kpi .l,.ln.sub,.fin .s,.note{font-size:14.5px}
  .kpi .v{font-size:27px}
  .bdg,.info .l,.sec,.hint{font-size:13.5px}
  .ln{font-size:16px} .ln.rem{font-size:19px} .profit .pv{font-size:21px}
  .bars .br{font-size:15px}
  .info .v,.tbl td{font-weight:600}
  .bdg.buy{color:#7A4705} .bdg.ship{color:#1A4A80} .bdg.done,.bdg.recv{color:#1F6340}
  .bdg.loc,.kpi.hl .v,.sec,.fsec,nav a.on,a.lnk{color:#A2440A}
}

@media (max-width:900px){
  .stages,.mapgrid{grid-template-columns:1fr}
  .grid.g3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .hwrap{padding:0 12px;gap:10px}
  .logo span{display:none}
  main{padding:16px 12px 50px}
  .grid,.grid.g3,.choice{grid-template-columns:1fr}
}
@media print{
  body{background:#fff}
  body > *:not(#print){display:none !important}
  #print{display:block;padding:10px;font-size:13px}
  #print table{width:100%;border-collapse:collapse;margin:8px 0}
  #print td,#print th{border:1px solid #ccc;padding:6px 8px;text-align:start}
  #print th{background:#f6f0ea}
  #print h1{color:#C2570C}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo"><img src="logo.png" alt="AWS"><span id="officeName">مكتب السيارات</span></div>
    <nav id="nav">
      <a data-v="cars">السيارات</a>
      <a data-v="customers">الزبائن</a>
      <a data-v="profits">الأرباح</a>
      <a data-v="map">خريطة المواني</a>
    </nav>
    <span id="cloud" class="small muted" style="white-space:nowrap"></span>
    <button class="btn ghost" onclick="openSettings()" title="الإعدادات">⚙️</button>
    <button class="btn pri" onclick="carForm()">＋ سيارة جديدة</button>
  </div>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<div id="toast"></div>
<div id="print"></div>
<div id="login">
  <form class="card box" onsubmit="event.preventDefault();doLogin()">
    <div class="logo" style="flex-direction:column;gap:6px"><img src="logo.png" alt="AWS"><span>AWS COMPANY</span></div>
    <div class="muted small" style="text-align:center;margin-bottom:18px">سجّل الدخول للوصول للبيانات</div>
    <div class="f" style="margin-bottom:12px"><label>البريد الإلكتروني</label><input class="inp" id="lgEmail" type="email" required style="direction:ltr"></div>
    <div class="f"><label>كلمة المرور</label><input class="inp" id="lgPass" type="password" required style="direction:ltr"></div>
    <div class="err" id="lgErr"></div>
    <button class="btn pri" style="width:100%;justify-content:center;margin-top:6px" id="lgBtn">دخول</button>
  </form>
</div>

<script src="ports-data.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===================== data ===================== */
const KEY = 'car_office_v1';
const P = window.AWS_PORTS || {ports:[], yards:[], states:[], markup:{tow:0, ocean_per_car:0}};
const LOC = ['تم الشراء','تم السداد','نقل داخلي','مستودع','في البحر','وصلت','تسلمت'];
const STG = {buy:'شراء', ship:'شحن', done:'مكتملة'};
const STGN = {buy:'المرحلة 1: الشراء', ship:'المرحلة 2: الشحن'};
const METHODS = ['نقدي','حوالة مصرفية','تحويل','صك','أخرى'];
const PORT_COLORS = {SAV:'#F2994A',HOU:'#E9C46A',NYC:'#6FA8DC',CHI:'#A58BD6',LAX:'#7BC47F',SEA:'#5BBFB5',HNL:'#E68AB8'};

let db = load();
let ui = {view:'cars', carId:null, filter:'all', q:'', month:thisMonth(), allMonths:false, drill:'recv', mapState:null};

function load(){
  let d; try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  d = d || {};
  d.cars = d.cars || [];
  d.customers = d.customers || [];
  d.settings = Object.assign({officeName:'AWS COMPANY', officeFee:0, wirePct:1.5, perContainer:4}, d.settings||{});
  return d;
}
/* storage: Firebase (Firestore) when firebase-config.js is filled in, otherwise this browser only */
const FBC = window.FIREBASE_CONFIG || {};
const USE_FB = !!(window.firebase && FBC.apiKey && !/PASTE|ضع/.test(FBC.apiKey));
let fs = null, fbAuth = null, unsub = [];
const plain = o => JSON.parse(JSON.stringify(o));
function fbErr(e){ console.error(e); toast('تعذر الحفظ في السحابة: ' + (e.code || e.message)); }
function save(c){
  if(!USE_FB){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('تعذر الحفظ في المتصفح!'); } return; }
  if(c) fs.collection('cars').doc(c.id).set(plain(c)).catch(fbErr);
}
function saveSettingsStore(){ if(USE_FB) fs.collection('meta').doc('settings').set(plain(db.settings)).catch(fbErr); else save(); }
function removeCar(id){ db.cars = db.cars.filter(c => c.id !== id); if(USE_FB) fs.collection('cars').doc(id).delete().catch(fbErr); else save(); }
function saveCust(cu){ if(!USE_FB) return save(); fs.collection('customers').doc(cu.id).set(plain(cu)).catch(fbErr); }
function removeCust(id){ db.customers = db.customers.filter(x => x.id !== id); if(USE_FB) fs.collection('customers').doc(id).delete().catch(fbErr); else save(); }
async function replaceAll(d){
  if(!USE_FB){ localStorage.setItem(KEY, JSON.stringify(d)); db = load(); return; }
  const ops = [];
  for(const col of ['cars','customers']){ (await fs.collection(col).get()).forEach(doc => ops.push(b => b.delete(doc.ref))); }
  d.cars.forEach(c => ops.push(b => b.set(fs.collection('cars').doc(c.id), plain(c))));
  (d.customers || []).forEach(cu => ops.push(b => b.set(fs.collection('customers').doc(cu.id), plain(cu))));
  if(d.settings) ops.push(b => b.set(fs.collection('meta').doc('settings'), plain(d.settings)));
  for(let i = 0; i < ops.length; i += 400){ const b = fs.batch(); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); }
}
function setCloud(t){ const el = $('#cloud'); if(el) el.innerHTML = t; }

function initFirebase(){
  firebase.initializeApp(FBC);
  fbAuth = firebase.auth(); fs = firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(() => {});
  db = {cars:[], customers:[], settings:load().settings};
  fbAuth.onAuthStateChanged(user => {
    unsub.forEach(f => f()); unsub = [];
    if(!user){ $('#login').classList.add('on'); setCloud(''); return; }
    $('#login').classList.remove('on');
    setCloud(`<span title="${esc(user.email)}">☁️</span> <span class="em">${esc(user.email)}</span> <a href="#" onclick="fbAuth.signOut();return false" style="color:var(--brand-d)">خروج</a>`);
    let first = true;
    unsub.push(fs.collection('cars').onSnapshot(snap => {
      db.cars = snap.docs.map(d => Object.assign({expenses:[], payments:[], refunds:[]}, d.data()));
      render();
      clearTimeout(syncTracking._t); syncTracking._t = setTimeout(syncTracking, 1500);
      if(first){ first = false; offerUpload(snap.empty); }
    }, fbErr));
    unsub.push(fs.collection('customers').onSnapshot(snap => { db.customers = snap.docs.map(d => d.data()); render(); }, fbErr));
    unsub.push(fs.collection('meta').doc('settings').onSnapshot(d => { if(d.exists){ db.settings = Object.assign(db.settings, d.data()); render(); } }, fbErr));
  });
}

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const r2 = n => Math.round(+((+n || 0) * 100).toFixed(6)) / 100;   // toFixed first so 14.475 rounds to 14.48
const N = v => (v === '' || v == null || isNaN(+v)) ? 0 : +v;
function today(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function thisMonth(){ return today().slice(0,7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){
  n = r2(n); const neg = n < 0;
  const s = '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
  return `<span class="num">${neg ? '−' : ''}${s}</span>`;
}
function dt(s){ return `<span class="num">${esc(s)}</span>`; }
function monthName(m){ if(!m) return ''; const [y,mm] = m.split('-'); return new Date(+y, +mm-1, 1).toLocaleDateString('ar-LY-u-nu-latn', {month:'long', year:'numeric'}); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }
function carName(c){ return [c.year, c.make].filter(Boolean).join(' ') || 'سيارة بدون اسم'; }
function getCar(id){ return db.cars.find(c => c.id === id); }
function expLabel(e){ return e.kind === 'fine' ? 'غرامة' : 'مصروف'; }
function getCust(id){ return db.customers.find(x => x.id === id); }
function carThumb(c){ return c.img ? `<img class="thumb" src="${esc(c.img)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;thumb&quot;>🚗</div>'">` : `<div class="thumb">🚗</div>`; }
function portById(id){ return P.ports.find(p => p.id === id); }
function yardLabel(y){ return `${y.n}, ${y.s} — ${y.a}`; }
const YARD_IDX = {}; P.yards.forEach((y,i) => YARD_IDX[yardLabel(y)] = i);

function quote(yi, pid, k){
  const y = P.yards[yi], res = {};
  if(y){ res.towCost = y.tow; res.towCharge = y.tow == null ? null : y.tow + (P.markup.tow||0); }
  const port = portById(pid || (y && y.p));
  if(port && port.ocean[k]){ const per = port.ocean[k] / k; res.oceanCost = r2(per); res.oceanCharge = r2(per + (P.markup.ocean_per_car||0)); }
  return res;
}

/* ===================== financial engine ===================== */
function calc(c){
  const ex = (payer, st) => c.expenses.filter(e => e.payer === payer && e.stage === st).reduce((s,e) => s + N(e.amount), 0);
  const pay = st => c.payments.filter(p => p.stage === st).reduce((s,p) => s + N(p.amount), 0);
  const base = N(c.buyPrice) + N(c.auctionFees);
  const wire = r2(base * N(c.wirePct) / 100);
  const custExp1 = ex('customer','buy'), offExp1 = ex('office','buy');
  const req1 = r2(base + N(c.officeFee) + wire + custExp1);
  const auctionByCust = c.auctionPaid && c.auctionPaid.by === 'customer' ? base : 0;
  const payments1 = pay('buy');
  const paid1 = r2(payments1 + auctionByCust);
  const rem1 = r2(req1 - paid1);
  const profit1 = r2(N(c.officeFee) + wire - offExp1);

  const custExp2 = ex('customer','ship'), offExp2 = ex('office','ship');
  const shipCharge = N(c.towCharge) + N(c.oceanCharge);
  const wire2 = r2((shipCharge + custExp2) * N(c.shipWirePct) / 100);   // optional transfer commission on shipping
  const req2 = r2(shipCharge + custExp2 + wire2);
  const paid2 = r2(pay('ship'));
  const rem2 = r2(req2 - paid2);
  const actual = N(c.towCost) + N(c.oceanCost);
  const profit2 = r2(shipCharge + wire2 - actual - offExp2);

  const advance = (c.auctionPaid && c.auctionPaid.by === 'office' && !c.lock1) ? Math.min(base, Math.max(rem1,0)) : 0;
  const refundDue = r2((c.refunds||[]).filter(x => !x.returned).reduce((s,x) => s + N(x.amount), 0));
  return {base, wire, custExp1, offExp1, req1, auctionByCust, payments1, paid1, rem1, profit1,
          custExp2, offExp2, shipCharge, wire2, req2, paid2, rem2, actual, profit2, advance, refundDue};
}

/* moves the car between financial stages based on money; locks/unlocks profits */
function sync(c){
  const k = calc(c), EPS = 0.004;
  if(!c.lock1 && k.req1 > 0 && k.rem1 <= EPS) c.lock1 = today();
  else if(c.lock1 && k.rem1 > EPS) c.lock1 = null;

  if(!c.lock2 && k.req2 > 0 && k.rem2 <= EPS && c.stage !== 'buy') c.lock2 = today();
  else if(c.lock2 && k.rem2 > EPS) c.lock2 = null;

  if(c.lock1 && c.stage === 'buy') c.stage = 'ship';
  // stage 2 may have been fully paid while stage 1 just finished
  if(!c.lock2 && k.req2 > 0 && k.rem2 <= EPS && c.stage === 'ship') c.lock2 = today();

  if(c.lock1 && c.lock2) c.stage = 'done';
  else if(c.stage === 'done') c.stage = 'ship';
  if(c.stage === 'ship' && !c.lock1 && !c.manualShip) c.stage = 'buy';
}
function commit(c){ if(c) sync(c); save(c); render(); }

        ${c.auctionPaid.by === 'office'

          : `✓ الزبون سدد للمزاد مباشرة (${money(k.base)}) بتاريخ ${dt(c.auctionPaid.date)} — تبقى عليه العمولات والمصاريف.`}
        <a href="#" onclick="auctionForm('${c.id}');return false" style="color:inherit;margin-right:6px">تعديل</a></div>`
    : `<button class="btn pri" style="width:100%;justify-content:center;margin-top:10px" onclick="auctionForm('${c.id}')">تم السداد للمزاد</button>`;

  const stage1 = `
  <div class="card stage ${isCur1 ? 'current' : ''} ${c.lock1 ? '' : ''}">
    <div class="top"><div class="n">1</div><h3>الشراء</h3><div class="sp"></div>${s1status}</div>
    <div class="body">
      <div class="sec">المطلوب من الزبون</div>
      ${ln('سعر الشراء في المزاد', money(c.buyPrice))}
      ${ln('رسوم المزاد', money(c.auctionFees))}
      ${ln('عمولة المكتب', money(c.officeFee))}
      ${ln(`عمولة الحوالة (<span class="num">${+N(c.wirePct).toFixed(2)}%</span>)`, money(k.wire))}
      ${exp1c.map(e => ln(`${expLabel(e)}: ${esc(e.desc)}`, money(e.amount), 'sub')).join('')}
      ${ln('إجمالي المطلوب', money(k.req1), 'tot')}
      ${k.auctionByCust ? ln('مدفوع للمزاد من الزبون', money(k.auctionByCust)) : ''}
      ${ln('دفعات الزبون', money(k.payments1))}
      ${ln('الباقي', money(k.rem1), 'rem ' + (k.rem1 > 0 ? 'due' : 'zero'))}
      ${auctionBox}
      <div class="profit ${k.profit1 < 0 ? 'loss' : c.lock1 ? 'recv' : ''}">
        <div class="row"><span class="small muted" style="font-weight:700">${k.profit1 < 0 ? 'خسارة المرحلة 1' : 'مكسب المرحلة 1'}</span><div class="sp"></div>
          ${c.lock1 ? `<span class="bdg recv">مستلم · ${dt(c.lock1)}</span>` : `<span class="bdg exp">متوقع</span>`}</div>
        <div class="pv ${pcls(k.profit1)}">${money(k.profit1)}</div>
        <div class="small muted">عمولة المكتب ${money(c.officeFee)} + الحوالة ${money(k.wire)} − مصاريف على المكتب ${money(k.offExp1)}</div>
      </div>
    </div>
  </div>`;

  const stage2 = `
  <div class="card stage ${isCur2 ? 'current' : ''} ${c.stage === 'buy' ? 'dim' : ''}">
    <div class="top"><div class="n">2</div><h3>الشحن</h3><div class="sp"></div>${s2status}</div>
    <div class="body">
      <div class="sec">المطلوب من الزبون</div>
      ${ln('السحب الداخلي', money(c.towCharge))}
      ${ln('الشحن البحري', money(c.oceanCharge))}
      ${exp2c.map(e => ln(`${expLabel(e)}: ${esc(e.desc)}`, money(e.amount), 'sub')).join('')}
      ${k.wire2 ? ln(`عمولة الحوالة (<span class="num">${+N(c.shipWirePct).toFixed(2)}%</span>)`, money(k.wire2)) : ''}
      ${ln('إجمالي المطلوب', money(k.req2), 'tot')}
      ${ln('دفعات الزبون', money(k.paid2))}
      ${ln('الباقي', money(k.rem2), 'rem ' + (k.rem2 > 0 ? 'due' : 'zero'))}
      <div class="sec">تكلفتنا الفعلية (لشركة الشحن)</div>
      ${ln('السحب', money(c.towCost), 'sub')}
      ${ln('البحري', money(c.oceanCost), 'sub')}
      <div class="profit ${k.profit2 < 0 ? 'loss' : c.lock2 ? 'recv' : ''}">
        <div class="row"><span class="small muted" style="font-weight:700">${k.profit2 < 0 ? 'خسارة المرحلة 2' : 'مكسب المرحلة 2'}</span><div class="sp"></div>
          ${c.lock2 ? `<span class="bdg recv">مستلم · ${dt(c.lock2)}</span>` : `<span class="bdg exp">متوقع</span>`}</div>
        <div class="pv ${pcls(k.profit2)}">${money(k.profit2)}</div>

  const expRows = c.expenses.slice().sort((a,b) => (a.date||'').localeCompare(b.date||'')).map(e => `<tr>
    <td>${e.kind === 'fine' ? '<span class="bdg bad">غرامة</span> ' : ''}${esc(e.desc)}</td><td><span class="bdg ${e.stage}">${STG[e.stage]}</span></td>
    <td>${e.payer === 'office' ? '<span class="bdg bad">على المكتب</span>' : '<span class="bdg loc">على الزبون</span>'}</td>
    <td><b>${money(e.amount)}</b></td><td class="num">${esc(e.date)}</td>
    <td style="text-align:end;white-space:nowrap"><button class="btn sm" onclick="expenseForm('${c.id}','${e.id}')">تعديل</button>
      <button class="btn sm danger" onclick="delExpense('${c.id}','${e.id}')">حذف</button></td></tr>`).join('');

  const payRows = c.payments.slice().sort((a,b) => (a.date||'').localeCompare(b.date||'')).map(p => `<tr>
    <td class="num">${esc(p.date)}</td><td><span class="bdg ${p.stage}">${STG[p.stage]}</span></td>
    <td><b>${money(p.amount)}</b></td><td>${esc(p.method)}</td><td class="muted">${esc(p.note)}</td>
    <td style="text-align:end;white-space:nowrap"><button class="btn sm" onclick="paymentForm('${c.id}','${p.id}')">تعديل</button>
      <button class="btn sm danger" onclick="delPayment('${c.id}','${p.id}')">حذف</button></td></tr>`).join('');

  const refRows = (c.refunds||[]).map(r => `<tr>
    <td class="num">${esc(r.date)}</td><td><b>${money(r.amount)}</b></td><td class="muted">${esc(r.note||'')}</td>
    <td>${r.returned ? `<span class="bdg done">تم الإرجاع ${dt(r.returned)}</span>` : `<span class="bdg bad">لم يُرجع</span>`}</td>
    <td style="text-align:end;white-space:nowrap">${r.returned ? '' : `<button class="btn sm" onclick="markReturned('${c.id}','${r.id}')">تم الإرجاع</button>`}
      <button class="btn sm danger" onclick="delRefund('${c.id}','${r.id}')">حذف</button></td></tr>`).join('');

  return `
  <div class="chead">
    <button class="btn" onclick="go('cars')">→ رجوع</button>
    <div style="flex:1;min-width:220px">
      <h1>${esc(carName(c))}</h1>
      <div class="muted">${c.customerId && getCust(c.customerId) ? `<a class="lnk" href="#" onclick="go('customer','${c.customerId}');return false">${esc(c.customer)}</a>` : esc(c.customer || 'بدون زبون')} ${c.phone ? '· <span class="num">' + esc(c.phone) + '</span>' : ''}</div>
    </div>
    <div class="actions">
      <button class="btn pri" onclick="paymentForm('${c.id}')">＋ دفعة من الزبون</button>
      <button class="btn" onclick="expenseForm('${c.id}')">＋ مصروف</button>
      <button class="btn" onclick="printInvoice('${c.id}')">🧾 فاتورة الزبون</button>
      ${c.vin ? `<button class="btn" onclick="trackLinkForm('${c.id}')">🔗 رابط التتبع</button>` : ''}
      <button class="btn" onclick="carForm('${c.id}')">تعديل</button>
      <button class="btn danger" onclick="delCar('${c.id}')">حذف</button>
    </div>
  </div>

  <div class="card pad ${c.img ? 'carinfo' : ''}" style="margin-bottom:16px">
    ${c.img ? `<div><img class="photo" id="mainPhoto" src="${esc(c.img)}" referrerpolicy="no-referrer" alt="" onerror="this.outerHTML='<div class=&quot;photo&quot; style=&quot;display:flex;align-items:center;justify-content:center;font-size:40px&quot;>🚗</div>'">
      ${(c.photos || []).length > 1 ? `<div class="gal">${c.photos.map(u => `<img src="${esc(u)}" loading="lazy" referrerpolicy="no-referrer" alt="" onclick="const m=document.getElementById('mainPhoto');if(m)m.src=this.src" onerror="this.remove()">`).join('')}</div>` : ''}
      ${c.link ? `<a class="lnk small" href="${esc(c.link)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px">🔗 فتح صفحة السيارة</a>` : ''}</div>` : ''}
    <div>
    ${!c.img && c.link ? `<a class="lnk small" href="${esc(c.link)}" target="_blank" rel="noopener" style="display:inline-block;margin-bottom:10px">🔗 فتح صفحة السيارة</a>` : ''}
    <div class="info">
      <div><div class="l">VIN</div><div class="v num">${esc(c.vin || '—')}</div></div>
      <div><div class="l">رقم اللوت</div><div class="v num">${esc(c.lot || '—')}</div></div>
      <div><div class="l">المزاد</div><div class="v">${esc(c.auction || '—')}</div></div>
      <div><div class="l">الساحة</div><div class="v">${y ? esc(yardLabel(y)) : '—'}</div></div>
      <div><div class="l">ميناء الشحن</div><div class="v">${port ? esc(port.name) : '—'}</div></div>
      <div><div class="l">تاريخ الشراء</div><div class="v num">${esc(c.date || '—')}</div></div>
    </div>
    ${c.notes ? `<div class="note info" style="margin-top:12px">${esc(c.notes)}</div>` : ''}
    </div>
  </div>

  <div class="card pad" style="margin-bottom:16px">
    <div class="row" style="margin-bottom:8px"><h3>مكان السيارة</h3><span class="small muted">(اضغط لتغييره — منفصل عن المرحلة المالية)</span></div>
    <div class="steps">${LOC.map((l,i) => `<div class="step ${i < (c.loc||0) ? 'past' : i === (c.loc||0) ? 'cur' : ''}" onclick="setLoc('${c.id}',${i})"><span class="dot"></span>${l}</div>`).join('')}</div>
  </div>

  <div class="card pad row">
    <h3>المرحلة المالية</h3>
    <div class="fin">
      <span class="s ${c.lock1 ? 'ok' : isCur1 ? 'on' : ''}">شراء</span><span class="arr">←</span>
      <span class="s ${c.lock2 ? 'ok' : isCur2 ? 'on' : ''}">شحن</span><span class="arr">←</span>
      <span class="s ${c.stage === 'done' ? 'ok' : ''}">مكتملة</span>
    </div>
    <div class="sp"></div>
    ${c.stage === 'buy' ? `<button class="btn" onclick="manualShip('${c.id}')">نقل يدوي لمرحلة الشحن</button>` : ''}

  <div class="stages">${stage1}${stage2}</div>

  <div class="card" style="margin-bottom:16px">
    <div class="pad row" style="border-bottom:1px solid var(--line)"><h3>المصاريف</h3><span class="small muted">على المكتب: ما تطلعش في فاتورة الزبون وتنقص من المكسب</span><div class="sp"></div><button class="btn sm" onclick="expenseForm('${c.id}')">＋ مصروف</button></div>
    ${expRows ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>الوصف</th><th>المرحلة</th><th>على</th><th>المبلغ</th><th>التاريخ</th><th></th></tr></thead><tbody>${expRows}</tbody></table></div>` : `<div class="empty">لا توجد مصاريف</div>`}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="pad row" style="border-bottom:1px solid var(--line)"><h3>دفعات الزبون</h3><div class="sp"></div><button class="btn sm" onclick="paymentForm('${c.id}')">＋ دفعة</button></div>
    ${payRows ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>التاريخ</th><th>المرحلة</th><th>المبلغ</th><th>الطريقة</th><th>ملاحظة</th><th></th></tr></thead><tbody>${payRows}</tbody></table></div>` : `<div class="empty">لا توجد دفعات</div>`}

  ${refRows ? `<div class="card"><div class="pad" style="border-bottom:1px solid var(--line)"><h3>مبالغ راجعة للزبون</h3></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>التاريخ</th><th>المبلغ</th><th>ملاحظة</th><th>الحالة</th><th></th></tr></thead><tbody>${refRows}</tbody></table></div></div>` : ''}
  `;
}

/* ---------- profits ---------- */
function profitRows(){
  const rows = [];
  db.cars.forEach(c => { const k = calc(c);
    rows.push({c, stage:'buy', amount:k.profit1, date:c.lock1});
    rows.push({c, stage:'ship', amount:k.profit2, date:c.lock2});
  });
  return rows;
}
function viewProfits(){
  const all = profitRows(), m = ui.allMonths ? '' : ui.month;
  const recv = all.filter(r => r.date && (!m || r.date.startsWith(m)));
  const sum = a => a.reduce((s,r) => s + r.amount, 0);
  const sets = {
    recv:  {t:'مكسب مستلم', rows:recv},
    recv1: {t:'مستلم — مرحلة الشراء', rows:recv.filter(r => r.stage === 'buy')},
    recv2: {t:'مستلم — مرحلة الشحن', rows:recv.filter(r => r.stage === 'ship')},
  };
  const card = (key, hl) => `<div class="card kpi click ${hl ? 'hl' : ''} ${ui.drill === key ? 'sel' : ''}" onclick="ui.drill='${key}';render()">
      <div class="l">${sets[key].t}</div><div class="v">${money(sum(sets[key].rows))}</div><div class="small muted">${sets[key].rows.length} مرحلة</div></div>`;
  const d = sets[ui.drill] || sets.recv;
  const drows = d.rows.slice().sort((a,b) => (b.date||'').localeCompare(a.date||'')).map(r => `<tr class="click" onclick="go('car','${r.c.id}')">
      <td><b>${esc(carName(r.c))}</b><div class="small muted num">${esc(r.c.vin||r.c.lot||'')}</div></td><td>${esc(r.c.customer||'—')}</td>
      <td><span class="bdg ${r.stage}">${STG[r.stage]}</span></td>
      <td class="num">${r.date ? esc(r.date) : '<span class="muted">لم تكتمل</span>'}</td>
      <td><b class="${pcls(r.amount)}">${money(r.amount)}</b></td></tr>`).join('');

  // last 12 months
  const months = []; const now = new Date();
  for(let i = 11; i >= 0; i--){ const dt = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0')); }
  const mv = months.map(mm => ({mm, v: sum(all.filter(r => r.date && r.date.startsWith(mm)))}));
  const max = Math.max(1, ...mv.map(x => x.v));

  return `
  <div class="row" style="margin-bottom:16px">
    <h1>الأرباح</h1><div class="sp"></div>
    <label class="row small" style="gap:6px"><input type="checkbox" ${ui.allMonths ? 'checked' : ''} onchange="ui.allMonths=this.checked;render()" style="accent-color:var(--brand)"> كل الشهور</label>
    <input type="month" class="inp" style="width:auto" value="${ui.month}" ${ui.allMonths ? 'disabled' : ''} onchange="ui.month=this.value||thisMonth();render()">
  </div>
  <div class="small muted" style="margin:-6px 0 10px">المستلم حسب تاريخ قفل المرحلة${m ? ' — ' + monthName(m) : ''}</div>
  <div class="kpis">${card('recv',true)}${card('recv1')}${card('recv2')}</div>
  <div class="card" style="margin-bottom:16px">
    <div class="pad row" style="border-bottom:1px solid var(--line)"><h3>${d.t}</h3><span class="muted small">— السيارات اللي وراه</span><div class="sp"></div><b>${money(sum(d.rows))}</b></div>
    ${drows ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>السيارة</th><th>الزبون</th><th>المرحلة</th><th>تاريخ القفل</th><th>المكسب</th></tr></thead><tbody>${drows}</tbody></table></div>` : `<div class="empty">لا يوجد</div>`}
  </div>
  <div class="card pad">
    <h3 style="margin-bottom:10px">المكسب المستلم — آخر 12 شهر</h3>
    <div class="bars">${mv.map(x => `<div class="br" style="cursor:pointer" onclick="ui.month='${x.mm}';ui.allMonths=false;ui.drill='recv';render()"><span class="small">${monthName(x.mm)}</span><div class="track"><div class="fill" style="width:${Math.max(0, x.v/max*100)}%"></div></div><b style="text-align:end">${money(x.v)}</b></div>`).join('')}</div>
  </div>`;
}

/* ---------- map ---------- */
function viewMap(){
  const k = db.settings.perContainer || 4;
  const sel = ui.mapState;
  const paths = P.states.map(s => `<path d="${s.d}" fill="${PORT_COLORS[s.p] || '#ddd'}" class="${sel === s.a ? 'sel' : ''}" onclick="ui.mapState='${s.a}';render()"><title>${esc(s.n)} → ${esc(s.p)}</title></path>`).join('');
  const labels = P.states.map(s => s.cx ? `<text x="${s.cx}" y="${s.cy}" text-anchor="middle">${s.a}</text>` : '').join('');
  const ports = P.ports.map(p => `<g><circle cx="${p.x}" cy="${p.y}" r="7" fill="#2A1D13" stroke="#fff" stroke-width="2.5"/><text x="${p.x}" y="${p.y - 11}" text-anchor="middle" style="font-size:11px;font-weight:700">${p.id}</text></g>`).join('');
  let side;
  if(sel){
    const st = P.states.find(s => s.a === sel);
    const yards = P.yards.map((y,i) => ({y,i})).filter(o => o.y.s === sel);
    side = `<div class="row" style="margin-bottom:10px"><h3>${esc(st ? st.n : sel)}</h3><div class="sp"></div><button class="btn sm" onclick="ui.mapState=null;render()">كل المواني</button></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>الساحة</th><th>ميناء</th><th>سحب (زبون)</th><th>بحري/سيارة</th></tr></thead><tbody>
      ${yards.map(o => { const q = quote(o.i, null, k); return `<tr><td>${esc(o.y.n)}<div class="small muted">${o.y.a}</div></td><td>${o.y.p}</td>
        <td>${q.towCharge == null ? '<span class="bdg exp">بانتظار السعر</span>' : money(q.towCharge) + `<div class="small muted">تكلفة ${money(q.towCost)}</div>`}</td>
        <td>${money(q.oceanCharge)}<div class="small muted">تكلفة ${money(q.oceanCost)}</div></td></tr>`; }).join('') || '<tr><td colspan="4" class="empty">لا توجد ساحات</td></tr>'}
      </tbody></table></div>`;
  } else {
    side = `<h3 style="margin-bottom:10px">الشحن البحري لكل سيارة (للزبون)</h3>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>الميناء</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody>
      ${P.ports.map(p => `<tr><td><b>${p.id}</b><div class="small muted">${esc(p.name)}</div></td>${[2,3,4].map(n => `<td>${money(p.ocean[n]/n + (P.markup.ocean_per_car||0))}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="small muted" style="margin-top:8px">الأعمدة = عدد السيارات في الحاوية. الأسعار شاملة هامش المكتب (سحب +${money(P.markup.tow)}، بحري +${money(P.markup.ocean_per_car)} للسيارة). تحديث الأسعار: ${esc(P.updated||'')}</div>
      <div class="small muted" style="margin-top:6px">اضغط على أي ولاية لعرض أسعار السحب من ساحاتها.</div>`;
  }
  return `<div class="row" style="margin-bottom:14px"><h1>خريطة المواني</h1></div>
  <div class="mapgrid">
    <div class="card pad map">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">${paths}${labels}${ports}</svg>
      <div class="legend" style="margin-top:10px">${P.ports.map(p => `<span><i style="background:${PORT_COLORS[p.id]}"></i>${esc(p.name)}</span>`).join('')}</div>
    </div>
    <div class="card pad">${side}</div>
  </div>`;
}

/* ===================== modal ===================== */
function openModal(title, body, foot, wide){
  $('#modalRoot').innerHTML = `<div class="mbg" onmousedown="if(event.target===this)closeModal()">
    <div class="modal ${wide ? 'wide' : ''}"><div class="mh"><h2>${title}</h2><div class="sp"></div><button class="btn ghost sm" onclick="closeModal()">✕</button></div>
    <div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div></div>`;
  const f = $('#modalRoot input:not([type=hidden]):not([type=radio]):not([type=checkbox]), #modalRoot select'); if(f) setTimeout(() => f.focus(), 30);
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
function ask(msg, yes, label='تأكيد'){
  window._ask = yes;
  openModal('تأكيد', `<div>${msg}</div>`, `<button class="btn pri" onclick="closeModal();window._ask()">${label}</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
const fld = (label, name, val, type='text', extra='', cls='') => `<div class="f ${cls}"><label>${label}</label><input class="inp" name="${name}" type="${type}" value="${esc(val ?? '')}" ${type === 'number' ? 'step="any"' : ''} ${extra}></div>`;
const formData = id => Object.fromEntries(new FormData(document.getElementById(id)).entries());

/* ---------- car form ---------- */

function cfEl(n){ return document.querySelector(`#cf [name="${n}"]`); }
function cfCust(){
  const cu = getCust(cfEl('customerId').value);
  $('#custHint').innerHTML = cu ? [cu.phone && `<span class="num">${esc(cu.phone)}</span>`, cu.city && esc(cu.city)].filter(Boolean).join(' · ') : (db.customers.length ? '' : 'ما فيش زبائن مسجلين — اضغط ＋ زبون جديد');
  if(cfEl('customerId').value){ $('#cfNew').style.display = 'none'; cfEl('newOpen').value = ''; }
}
function cfNewCust(){
  const box = $('#cfNew'), open = box.style.display === 'none';
  box.style.display = open ? '' : 'none'; cfEl('newOpen').value = open ? '1' : '';
  if(open){
    const sel = cfEl('customerId');
    if(sel.value === '__legacy'){ const c = getCar(window._cfId); if(c){ cfEl('newName').value = c.customer || ''; cfEl('newPhone').value = c.phone || ''; } }
    sel.value = ''; $('#custHint').textContent = ''; cfEl('newName').focus();
  }
}
/* VIN → year / make / model from the free NHTSA decoder (works for cars made for the US market) */
async function vinLookup(force){
  const el = cfEl('vin'), h = $('#vinHint');
  const v = el.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ''); el.value = v;
  if(v.length !== 17){ if(force) h.textContent = `رقم الهيكل لازم يكون 17 خانة (كتبت ${v.length})`; return; }
  if(vinLookup.last === v && !force) return; vinLookup.last = v;
  h.textContent = 'جاري البحث…';
  try{
    const r = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${v}?format=json`);
    const x = (await r.json()).Results[0];
    if(!x || !x.Make){ h.textContent = 'ما لقيناش بيانات لهذا الرقم — تأكد منه أو اكتب الاسم يدوياً'; return; }
    const make = x.Make.split(/\s+/).map(w => w.length <= 3 ? w : w[0] + w.slice(1).toLowerCase()).join(' ');
    const name = [make, x.Model, x.Trim && x.Trim.length <= 14 ? x.Trim : ''].filter(Boolean).join(' ');
    if(x.ModelYear) cfEl('year').value = x.ModelYear;
    cfEl('make').value = name;
    h.innerHTML = `✓ <b>${esc(x.ModelYear)} ${esc(name)}</b>${x.BodyClass ? ' · ' + esc(x.BodyClass) : ''}${x.DisplacementL ? ' · <span class="num">' + esc((+x.DisplacementL).toFixed(1)) + 'L</span>' : ''}`;
  }catch(e){ vinLookup.last = null; h.textContent = 'تعذر الاتصال بخدمة رقم الهيكل — تأكد من الإنترنت'; }
}
/* car photo: a direct image link, a page link (photo read from the page's preview image), or an upload */
function imgSet(v){
  cfEl('img').value = v || '';
  const im = $('#imgPrev'); im.style.display = v ? '' : 'none'; if(v) im.src = v; else im.removeAttribute('src');
  $('#imgDel').style.display = v ? '' : 'none';
}
function canLoadImage(u){
  return new Promise(res => { const i = new Image(); const t = setTimeout(() => res(false), 7000);
    i.referrerPolicy = 'no-referrer'; i.onload = () => { clearTimeout(t); res(i.naturalWidth > 40); }; i.onerror = () => { clearTimeout(t); res(false); }; i.src = u; });
}
async function imgFromLink(force){
  const u = cfEl('link').value.trim(), h = $('#imgHint');
  if(!/^https?:\/\//i.test(u)){ if(force || u) h.textContent = 'الصق رابط يبدأ بـ https://'; return; }
  h.textContent = 'جاري جلب الصورة…';
  if(await canLoadImage(u)){ imgSet(u); h.textContent = '✓ تمت إضافة الصورة'; return; }
  try{
    const j = await (await fetch('https://api.microlink.io/?url=' + encodeURIComponent(u))).json();
    const im = j.status === 'success' && j.data && j.data.image && j.data.image.url;
    if(im && await canLoadImage(im)){ imgSet(im); h.textContent = '✓ تم جلب الصورة من الصفحة'; return; }
  }catch(e){}
  h.innerHTML = 'ما قدرناش نجيب صورة من هذي الصفحة. افتحها، كليك يمين على صورة السيارة ← <b>نسخ عنوان الصورة</b> (Copy image address) والصقه هنا، أو ارفع الصورة من الجهاز. الرابط يبقى محفوظ.';
}
function imgUpload(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { const i = new Image(); i.onload = () => {
    const sc = Math.min(1, 900 / Math.max(i.width, i.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(i.width * sc); cv.height = Math.round(i.height * sc);
    cv.getContext('2d').drawImage(i, 0, 0, cv.width, cv.height);
    imgSet(cv.toDataURL('image/jpeg', 0.72)); $('#imgHint').textContent = '✓ تمت إضافة الصورة من الجهاز';
  }; i.src = rd.result; };
  rd.readAsDataURL(f);
}
function cfWire(){
  const b = N(cfEl('buyPrice').value) + N(cfEl('auctionFees').value);
  $('#wireHint').innerHTML = `= ${money(b * N(cfEl('wirePct').value) / 100)}`;
}
function cfYard(){
  const i = YARD_IDX[cfEl('yard').value];
  if(i == null){ $('#yardHint').textContent = cfEl('yard').value ? 'ساحة غير موجودة في الخريطة — أدخل الأسعار يدوياً' : ''; return; }
  const y = P.yards[i]; cfEl('port').value = y.p;
  const q = quote(i, y.p, +cfEl('perContainer').value);
  if(q.towCharge != null){ cfEl('towCharge').value = q.towCharge; cfEl('towCost').value = q.towCost; $('#yardHint').textContent = `ميناء ${y.p} · سحب ${q.towCharge}$ (تكلفة ${q.towCost}$)`; }
  else { $('#yardHint').textContent = `ميناء ${y.p} · سعر السحب لهذه الساحة غير متوفر بعد — أدخله يدوياً`; }
  cfOcean();
}
function cfOcean(){
  const pid = cfEl('port').value; if(!pid) return;
  const q = quote(null, pid, +cfEl('perContainer').value);
  if(q.oceanCharge != null){ cfEl('oceanCharge').value = q.oceanCharge; cfEl('oceanCost').value = q.oceanCost; }
}
function saveCar(id){
  const d = formData('cf');
  const nums = ['buyPrice','auctionFees','officeFee','wirePct','shipWirePct','towCharge','oceanCharge','towCost','oceanCost','perContainer'];
  nums.forEach(n => d[n] = N(d[n]));
  const yi = YARD_IDX[d.yard]; d.yard = yi == null ? null : yi;
  let cu = null;
  if(d.newOpen && d.newName.trim()){
    cu = {id:uid(), created:new Date().toISOString(), name:d.newName.trim(), phone:d.newPhone.trim(), phone2:'', city:d.newCity.trim(), notes:''};
    db.customers.push(cu); saveCust(cu);
  } else if(d.customerId && d.customerId !== '__legacy') cu = getCust(d.customerId);
  const keepLegacy = !cu && d.customerId === '__legacy';
  if(!cu && !keepLegacy){ $('#custHint').innerHTML = '<span style="color:var(--bad)">اختر الزبون أو أضف زبون جديد</span>'; cfEl('customerId').focus(); return; }
  ['newOpen','newName','newPhone','newCity'].forEach(k => delete d[k]);
  if(cu){ d.customerId = cu.id; d.customer = cu.name; d.phone = cu.phone || ''; } else delete d.customerId;
  let c = id ? getCar(id) : null;
  if(c) Object.assign(c, d);
  else { c = Object.assign({id:uid(), created:new Date().toISOString(), stage:'buy', loc:0, expenses:[], payments:[], refunds:[], auctionPaid:null, lock1:null, lock2:null, manualShip:false}, d); db.cars.push(c); }
  closeModal(); commit(c); if(!id) go('car', c.id); toast('تم الحفظ');
}
function delCar(id){ ask('حذف هذه السيارة وكل دفعاتها ومصاريفها؟ لا يمكن التراجع.', () => { removeCar(id); go('cars'); toast('تم الحذف'); }, 'حذف'); }

/* ---------- location / stage ---------- */
function setLoc(id, i){ const c = getCar(id); c.loc = i; c.locAt = Object.assign({}, c.locAt, {[i]: today()}); commit(c); }
function manualShip(id){
  const c = getCar(id), k = calc(c);
  ask(`نقل السيارة لمرحلة الشحن قبل ما يكمل الزبون؟<br><span class="muted small">الباقي من المرحلة 1 (${money(k.rem1)}) يبقى ظاهر كدين عليه، ومكسبها ما يتحسبش مستلم لين يكمل.</span>`,
    () => { c.manualShip = true; c.stage = 'ship'; commit(c); toast('انتقلت لمرحلة الشحن'); }, 'نقل');
}
function undoManualShip(id){ const c = getCar(id); c.manualShip = false; c.stage = 'buy'; commit(c); }

/* ---------- auction paid ---------- */
function auctionForm(id){
  const c = getCar(id), k = calc(c);
  openModal('تم السداد للمزاد', `
    <div style="margin-bottom:12px">مين دفع للمزاد؟ <span class="muted">(سعر الشراء + الرسوم = ${money(k.base)})</span></div>
    <div class="f" style="margin-bottom:12px"><label>تاريخ السداد</label><input class="inp" type="date" id="apDate" value="${c.auctionPaid ? c.auctionPaid.date : today()}"></div>
    <div class="choice">
      <button class="big" onclick="setAuction('${id}','office')"><b>أنا (المكتب)</b><span class="small muted">المبلغ يتسجل دين على الزبون (سلفة منا)</span></button>
      <button class="big" onclick="setAuction('${id}','customer')"><b>الزبون</b><span class="small muted">سعر الشراء والرسوم يتحسبوا مدفوعين، وتبقى عليه العمولات والمصاريف</span></button>
    </div>`,
    c.auctionPaid ? `<button class="btn danger" onclick="setAuction('${id}',null)">إلغاء تسجيل السداد</button>` : '');
}
function setAuction(id, by){
  const c = getCar(id);
  c.auctionPaid = by ? {by, date: $('#apDate').value || today()} : null;
  if(by && (c.loc||0) < 1) c.loc = 1;
  closeModal(); commit(c); toast(by ? 'تم تسجيل السداد للمزاد' : 'تم الإلغاء');
}

/* ---------- payments ---------- */
function paymentForm(id, pid){
  const c = getCar(id);
  const p = pid ? c.payments.find(x => x.id === pid) : null;
  // when editing, the remaining balance is computed without this payment
  const k = calc(p ? Object.assign({}, c, {payments: c.payments.filter(x => x.id !== pid)}) : c);
  const def = p ? p.stage : c.stage === 'buy' ? 'buy' : 'ship';
  openModal(p ? 'تعديل الدفعة' : 'دفعة من الزبون', `<form id="pf" class="grid" onsubmit="event.preventDefault();savePayment('${id}','${pid||''}')">
    ${fld('المبلغ ($)','amount',p ? p.amount : '','number','required min="0.01" oninput="pfCheck()"')}
    ${fld('التاريخ','date',p ? p.date : today(),'date')}
    <div class="f"><label>تنحسب على</label><select class="inp" name="stage" onchange="pfCheck()">
      <option value="buy" ${def === 'buy' ? 'selected' : ''}>المرحلة 1: الشراء — الباقي $${r2(k.rem1)}</option>
      <option value="ship" ${def === 'ship' ? 'selected' : ''}>المرحلة 2: الشحن — الباقي $${r2(k.rem2)}</option></select>
      ${def === 'ship' && k.rem1 > 0 ? `<div class="hint" style="color:var(--bad)">ملاحظة: باقي دين على المرحلة 1 (${money(k.rem1)})</div>` : ''}</div>
    <div class="f"><label>طريقة الدفع</label><select class="inp" name="method">${METHODS.map(m => `<option ${p && p.method === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
    ${fld('ملاحظة','note',p ? p.note : '','text','','full')}
    <div class="f full" id="overflow"></div>
  </form>`, `<button class="btn pri" onclick="document.getElementById('pf').requestSubmit()">حفظ الدفعة</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
  window._pfRem = {buy: k.rem1, ship: k.rem2};
  if(p) pfCheck();
}
function pfCheck(){
  const f = document.getElementById('pf'); const amt = N(f.amount.value), st = f.stage.value;
  const rem = Math.max(0, window._pfRem[st]); const extra = r2(amt - rem); const box = $('#overflow');
  if(extra <= 0.004){ box.innerHTML = ''; return; }
  const prev = (f.querySelector('input[name=over]:checked') || {}).value;
  const canNext = st === 'buy';
  const v = prev && (prev !== 'next' || canNext) ? prev : (canNext ? 'next' : 'refund');
  box.innerHTML = `<div class="note" style="margin:0 0 8px">الدفعة أكبر من الباقي في المرحلة بـ <b>${money(extra)}</b>. الزيادة:</div>
    <div class="choice">
      ${canNext ? `<label><input type="radio" name="over" value="next" ${v === 'next' ? 'checked' : ''}><span><b>تنحط في المرحلة الجاية</b><div class="small muted">تتحسب دفعة على الشحن</div></span></label>` : ''}
      <label><input type="radio" name="over" value="refund" ${v === 'refund' ? 'checked' : ''}><span><b>تتسجل راجع للزبون</b><div class="small muted">مبلغ مستحق نرجعه له</div></span></label>
    </div>`;
}
function savePayment(id, pid){
  const c = getCar(id), d = formData('pf');
  const amt = r2(N(d.amount)); if(amt <= 0) return;
  if(pid) c.payments = c.payments.filter(x => x.id !== pid);   // editing: replace the old payment, keep its id
  const k = calc(c); const rem = Math.max(0, d.stage === 'buy' ? k.rem1 : k.rem2);
  const base = {date:d.date || today(), method:d.method, note:d.note};
  const newId = pid || uid();
  if(amt > rem + 0.004){
    const extra = r2(amt - rem);
    if(rem > 0) c.payments.push(Object.assign({id:newId, stage:d.stage, amount:rem}, base));
    if(d.over === 'next' && d.stage === 'buy'){
      c.payments.push(Object.assign({id:uid(), stage:'ship', amount:extra}, base, {note:(d.note ? d.note + ' — ' : '') + 'زيادة من مرحلة الشراء'}));
    } else {
      c.refunds = c.refunds || [];
      c.refunds.push({id:uid(), amount:extra, date:base.date, note:(d.note || 'زيادة في دفعة') + ' (' + base.method + ')', returned:null});
    }
  } else c.payments.push(Object.assign({id:newId, stage:d.stage, amount:amt}, base));
  const before = c.stage;
  closeModal(); commit(c);
  toast(c.stage !== before ? (c.stage === 'done' ? 'اكتملت السيارة ✓ — المكسب مستلم' : c.stage === 'ship' ? 'اكتملت المرحلة 1 ✓ — انتقلت للشحن' : 'تم التعديل') : pid ? 'تم تعديل الدفعة' : 'تم تسجيل الدفعة');
}
function delPayment(cid, pid){ ask('حذف هذه الدفعة؟', () => { const c = getCar(cid); c.payments = c.payments.filter(p => p.id !== pid); commit(c); }, 'حذف'); }
function markReturned(cid, rid){ const c = getCar(cid); const r = c.refunds.find(x => x.id === rid); r.returned = today(); commit(c); }
function delRefund(cid, rid){ ask('حذف هذا المبلغ الراجع؟', () => { const c = getCar(cid); c.refunds = c.refunds.filter(x => x.id !== rid); commit(c); }, 'حذف'); }

/* ---------- expenses ---------- */

const PUB = new URLSearchParams(location.search).has('vin') || location.hash === '#track';
const vinKey = v => String(v || '').trim().toUpperCase();
function trackUrl(vin){
  const base = /^(localhost|127\.)/.test(location.hostname) ? 'https://aws-company.vercel.app/' : location.origin + location.pathname;
  return base + '?vin=' + encodeURIComponent(vinKey(vin));
}
/* what the customer may see — no costs, no office profit */
function trkSnap(c){
  const k = calc(c), port = portById(c.port);
  const ce = st => c.expenses.filter(e => e.payer === 'customer' && e.stage === st).map(e => ({t:(e.kind === 'fine' ? 'غرامة: ' : '') + (e.desc || 'مصروف'), a:r2(e.amount)}));
  const s1 = [{t:'سعر الشراء في المزاد', a:r2(c.buyPrice)}, {t:'رسوم المزاد', a:r2(c.auctionFees)}, {t:'عمولة المكتب', a:r2(c.officeFee)},
              {t:`عمولة الحوالة (${+N(c.wirePct).toFixed(2)}%)`, a:k.wire}, ...ce('buy')];
  const s2 = [{t:'السحب الداخلي', a:r2(c.towCharge)}, {t:'الشحن البحري', a:r2(c.oceanCharge)}, ...ce('ship')];
  if(k.wire2) s2.push({t:`عمولة الحوالة (${+N(c.shipWirePct).toFixed(2)}%)`, a:k.wire2});
  const showShip = c.stage !== 'buy' || k.paid2 > 0;
  return {
    vin: vinKey(c.vin), title: carName(c), lot: c.lot || '', auction: c.auction || '', port: port ? port.name : '',
    customer: c.customer || '', office: db.settings.officeName || 'AWS COMPANY',
    loc: c.loc || 0, locAt: c.locAt || {}, img: c.img || '', photos: (c.photos || []).slice(0, 12),
    s1: {items: s1.filter(x => x.a), req: k.req1, paid: k.paid1, rem: k.rem1, done: !!c.lock1},
    s2: showShip ? {items: s2.filter(x => x.a), req: k.req2, paid: k.paid2, rem: k.rem2, done: !!c.lock2} : null,
    pays: c.payments.slice().sort((a,b) => (a.date||'').localeCompare(b.date||'')).map(p => ({date:p.date || '', stage:p.stage, a:r2(p.amount)})),
  };
}
const hstr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
let trkBusy = false;
/* keep tracking/{VIN} in step with the cars: write what changed, remove VINs that no longer exist */
async function syncTracking(){
  if(!USE_FB || PUB || trkBusy || !fbAuth.currentUser) return;
  trkBusy = true;
  try{
    let seen = {}; try{ seen = JSON.parse(localStorage.getItem('trk_h') || '{}'); }catch(e){}
    const now = {};
    for(const c of db.cars){
      const v = vinKey(c.vin); if(v.length < 5) continue;
      const snap = trkSnap(c), h = hstr(JSON.stringify(snap)); now[v] = h;
      if(seen[v] !== h){ snap.updated = new Date().toISOString(); await fs.collection('tracking').doc(v).set(snap); }
    }
    for(const v of Object.keys(seen)) if(!now[v]) await fs.collection('tracking').doc(v).delete().catch(() => {});
    try{ localStorage.setItem('trk_h', JSON.stringify(now)); }catch(e){}
  }catch(e){ console.error('tracking sync', e); }
  finally{ trkBusy = false; }
}
function waPhone(p){ p = String(p || '').replace(/\D/g, ''); if(p.startsWith('00')) p = p.slice(2); if(p.startsWith('0')) p = '218' + p.slice(1); return p; }

  const f = v.fin || {}, mk = P.markup || {};
  const yardIdx = P.yards.findIndex(y => y.s === v.yard_state && y.n.toLowerCase() === String(v.yard || '').toLowerCase());
  const base = N(f.bid_price) + N(f.auction_fees);
  const tc = N(f.transfer_commission);
  // the old program charged one % on the purchase (paid with stage 1) and the same % on shipping + shipping extras (paid later)
  const pct = N(((v.transfers || []).find(t => t.cust_pct) || {}).cust_pct) || 1.5;
  const shipBase = N(f.inland_shipping) + N(f.ocean_shipping) + (v.extras || []).filter(x => x.st !== 1).reduce((s, x) => s + N(x.a), 0);
  let wirePct = pct, shipWirePct = pct;
  if(Math.abs(r2(base * pct / 100) + r2(shipBase * pct / 100) - tc) > 0.03){
    // e.g. the % was also taken on a stage-1 fine: shipping keeps its %, stage 1 keeps the rest of the old amount
    const w1 = r2(tc - r2(shipBase * pct / 100));
    if(w1 >= 0 && base > 0) wirePct = Math.round(w1 / base * 100 * 1e6) / 1e6;
    else { wirePct = base > 0 ? Math.round(tc / base * 100 * 1e6) / 1e6 : 1.5; shipWirePct = 0; }
  }
  const actual = N(vi && vi.shipping_cost_actual);
  let oceanCost = Math.max(0, N(f.ocean_shipping) - N(mk.ocean_per_car)), towCost, estimated = false;
  if(actual > 0){ towCost = r2(actual - oceanCost); if(towCost < 0){ towCost = 0; oceanCost = actual; } }
  else { towCost = Math.max(0, N(f.inland_shipping) - N(mk.tow)); estimated = true; }
  const auctionTr = (v.transfers || []).filter(t => t.purpose === 'auction');
  const by = v.auction_paid_by === 'office' || v.auction_paid_by === 'customer' ? v.auction_paid_by : (auctionTr.length ? 'office' : null);
  const date = v.purchase_date || String(v.created_at || '').slice(0,10) || today();
  const expenses = [];
  (v.extras || []).forEach((x, i) => expenses.push({id:'old_x' + i, desc:x.d || 'رسوم', amount:r2(N(x.a)), date, payer:'customer',
    stage:x.st === 1 ? 'buy' : 'ship', kind:OI_FINE.test(x.d || '') || x.st === 1 ? 'fine' : 'expense'}));
  if(N(f.other_fees) > 0) expenses.push({id:'old_of', desc:'رسوم أخرى', amount:r2(N(f.other_fees)), date, payer:'customer', stage:'buy', kind:'expense'});
  // fines the office paid to the auction (late fee, storage…) — not charged to the customer in the old program
  (v.transfers || []).filter(t => t.purpose && t.purpose !== 'auction').forEach(t => (t.items || []).forEach((it, i) => {
    if(!N(it.a)) return;
    expenses.push({id:'old_t' + t.id + '_' + i, desc:[OI_ITEM[it.k] || it.k || 'رسوم', t.payee, it.note || t.notes].filter(Boolean).join(' — '),
      amount:r2(N(it.a)), date:t.date || date, payer:'office', stage:'buy', kind:'fine'});
  }));
  // what the office really paid to move the money (PayPal / card fees, FX loss, invoice gaps) — borne by the office, not the customer
  const tcost = (vi && vi.tcost) || {}, tcostd = (vi && vi.tcostd) || {};
  const OI_PAYM = {paypal:'PayPal', card:'بطاقة', wire:'حوالة', zelle:'Zelle', cash:'نقدي'};
  Object.keys(tcost).forEach(tid => {
    const amt = r2(N(tcost[tid])); if(!amt) return;
    const d = tcostd[tid] || {}, tr = (v.transfers || []).find(t => t.id === tid) || {};
    const fine = amt > 0 && OI_FINE.test(d.note || '');
    const m = d.method || tr.method;
    const desc = [amt < 0 ? 'استرجاع على الدفع' : fine ? 'تخزين / تأخير' : 'عمولة الدفع', m && m !== 'other' ? (OI_PAYM[m] || m) : '', tr.payee, d.note].filter(Boolean).join(' — ');
    expenses.push({id:'old_c' + tid, desc, amount:amt, date:tr.date || String(d.at || '').slice(0,10) || date, payer:'office',
      stage:tr.purpose && /ship|tow|ocean|freight/i.test(tr.purpose) ? 'ship' : 'buy', kind:fine ? 'fine' : 'expense'});
  });
  const notes = [v.notes, v.engine && 'المحرك: ' + v.engine, v.color && 'اللون: ' + v.color,
    v.container_number && 'الحاوية: ' + v.container_number, v.booking_number && 'الحجز: ' + v.booking_number,
    estimated && '(تكلفة الشحن الفعلية مش مسجلة في البرنامج القديم — مقدّرة)'].filter(Boolean).join(' · ');
  return {
    id:v.id, created:v.created_at || new Date().toISOString(), customerId:custId, customer:cust ? cust.name : '', phone:cust ? cust.phone : '',
    date, year:String(v.year || ''), make:[oiTitle(v.make), oiTitle(v.model)].filter(Boolean).join(' '), vin:v.vin || '', lot:v.lot_number || '',
    auction:['Copart','IAAI','Manheim'].includes(v.auction_name) ? v.auction_name : (v.auction_name ? 'أخرى' : 'Copart'),
    yard:yardIdx >= 0 ? yardIdx : null, port:v.us_port || '', perContainer:N(v.cars_per_container) || db.settings.perContainer || 4,
    buyPrice:N(f.bid_price), auctionFees:N(f.auction_fees), officeFee:N(f.office_commission), wirePct, shipWirePct,
    towCharge:N(f.inland_shipping), oceanCharge:N(f.ocean_shipping), towCost, oceanCost,
    notes, loc:oiLoc(v.status), auctionPaid:by ? {by, date:v.auction_paid_date || (auctionTr[0] && auctionTr[0].date) || date} : null,
    expenses, oldImported:today()
  };
}
async function oldImport(mode){
  const err = $('#oiErr'), out = $('#oiOut'); err.textContent = '';
  try{
    if(!oldApp) oldApp = firebase.initializeApp(OLD_CFG, 'old');
    const au = oldApp.auth(), ofs = oldApp.firestore();
    if(!au.currentUser){
      if(mode === 'google') await au.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      else await au.signInWithEmailAndPassword($('#oiEmail').value.trim(), $('#oiPass').value);
    }
    out.innerHTML = '<div class="muted">جاري قراءة البيانات…</div>';
    const [vs, cs, ps] = await Promise.all([ofs.collection('vehicles').get(), ofs.collection('customers').get(), ofs.collection('payments').get()]);
    const payByCar = {};
    ps.forEach(d => { const p = Object.assign({id:d.id}, d.data()); if(p.vehicle_id && !p.deleted) (payByCar[p.vehicle_id] = payByCar[p.vehicle_id] || []).push(p); });
    const vi = {}; let viOk = true;
    try{ (await ofs.collection('vinternal').get()).forEach(d => vi[d.id] = d.data()); }catch(e){ viOk = false; }
    out.innerHTML = '<div class="muted">جاري قراءة الصور…</div>';
    const photos = await oldPhotos(vs.docs.map(d => d.data().vin));
    const oldCust = {}; cs.forEach(d => oldCust[d.id] = Object.assign({id:d.id}, d.data()));
    const digits = p => String(p || '').replace(/\D/g, '').slice(-9);
    const custs = new Map(), cars = [];
    vs.forEach(d => {
      const v = Object.assign({id:d.id}, d.data()); if(v.deleted) return;
      const oc = oldCust[v.customer_id];
      let cu = null;
      if(oc){
        cu = getCust(oc.id) || (digits(oc.phone) && db.customers.find(x => digits(x.phone) === digits(oc.phone))) || custs.get(oc.id);
        if(!cu) cu = {id:oc.id, created:oc.created_at || new Date().toISOString(), name:oc.full_name || oc.name || 'زبون', phone:oc.phone || '',
          phone2:oc.alternate_phone || '', city:oc.city || '', notes:[oc.notes, oc.code && 'كود: ' + oc.code].filter(Boolean).join(' · '), _new:true};
        custs.set(oc.id, cu);
      }
      const car = oiCar(v, vi[v.id], cu ? cu.id : '', cu);
      if(photos[v.vin]) car.photos = photos[v.vin];
      oiPayments(car, payByCar[v.id] || []);
      cars.push(car);
    });
    oldPlan = {cars, custs:[...new Set(custs.values())].filter(c => c._new)};
    const fines = cars.reduce((s, c) => s + c.expenses.filter(e => e.kind === 'fine').length, 0);
    const npay = cars.reduce((s, c) => s + c.oldPayments.length, 0);
    const fees = cars.flatMap(c => c.expenses.filter(e => String(e.id).startsWith('old_c')));
    const upd = cars.filter(c => getCar(c.id)).length;
    $('#oiLogin').style.display = 'none'; $('#oiBtns').innerHTML = `<button class="btn pri" onclick="oldImportRun()">استيراد ${cars.length} سيارة</button>`;
    out.innerHTML = `<div class="note info" style="margin:0 0 10px">لقينا <b>${cars.length}</b> سيارة${upd ? ` (منهم ${upd} موجودين — يتحدّثوا)` : ''}، و<b>${oldPlan.custs.length}</b> زبون جديد، و<b>${fines}</b> غرامة، و<b>${npay}</b> دفعة للمرحلة 1، و<b>${fees.length}</b> عمولة دفع على المكتب (${money(fees.reduce((s,e) => s + e.amount, 0))}).${viOk ? '' : '<br>⚠ حسابك ما عندهش صلاحية الأرباح في القديم، فتكلفة الشحن الفعلية تكون مقدّرة.'}</div>
      <div class="tblwrap" style="max-height:300px;overflow:auto"><table class="tbl"><thead><tr><th>السيارة</th><th>الزبون</th><th>المكان</th><th>دفعات المرحلة 1</th><th>غرامات</th></tr></thead><tbody>
      ${cars.map(c => { const t = Object.assign({stage:'buy', refunds:[], payments:c.oldPayments}, c, {payments:c.oldPayments}); const k = calc(t);
        return `<tr><td><b>${esc(carName(c))}</b><div class="small muted num">${esc(c.vin)}</div></td><td>${esc(c.customer || '—')}</td><td><span class="bdg loc">${LOC[c.loc]}</span></td>
        <td>${money(c.oldPayments.reduce((s,p) => s + p.amount, 0))} <span class="small muted">من ${money(k.req1)}</span>
          ${k.rem1 <= 0.004 ? '<div class="small" style="color:var(--ok)">✓ تكمل المرحلة 1</div>' : `<div class="small" style="color:var(--bad)">باقي ${money(k.rem1)}</div>`}
          ${c.skippedPay > 0 ? `<div class="small" style="color:var(--info)">${money(c.skippedPay)} زيادة عن المرحلة 1 — ما تنقلتش</div>` : ''}</td>
        <td>${c.expenses.filter(e => e.kind === 'fine').map(e => `<div class="small">${esc(e.desc)} ${money(e.amount)} <span class="muted">(${e.payer === 'office' ? 'على المكتب' : 'على الزبون'})</span></div>`).join('') || '<span class="muted">—</span>'}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  }catch(e){
    console.error(e); out.innerHTML = '';
    err.textContent = /invalid|wrong|not-found|user-not/.test(e.code || '') ? 'البريد أو كلمة المرور غلط' :
      e.code === 'permission-denied' ? 'هذا الحساب ما عندهش صلاحية يقرأ بيانات البرنامج القديم' :
      /popup/.test(e.code || '') ? 'نافذة Google انقفلت أو انمنعت — جرّب البريد وكلمة المرور' : 'تعذر: ' + (e.code || e.message);
  }
}
/* old payments → stage-1 payments only, up to what stage 1 still needs; anything beyond is reported, not imported */
const OI_METHOD = {cash_usd:'نقدي', cash:'نقدي', cash_lyd:'نقدي', bank:'حوالة مصرفية', transfer:'تحويل', wire:'حوالة مصرفية', cheque:'صك', check:'صك'};
function oiPayments(car, list){
  const total = r2(list.reduce((s, p) => s + N(p.amount_usd != null ? p.amount_usd : p.amount), 0));
  // in the old program "customer paid the auction" meant the customer's money went through the office — it's inside these payments
  if(car.auctionPaid && car.auctionPaid.by === 'customer' && total >= N(car.buyPrice) + N(car.auctionFees) - 0.01) car.auctionPaid.by = 'office';
  const own = (getCar(car.id) || {}).payments || [];
  const tmp = Object.assign({stage:'buy', refunds:[], payments:own.filter(p => !String(p.id).startsWith('old_') && p.stage === 'buy')}, car);
  let room = Math.max(0, calc(tmp).rem1);
  car.oldPayments = []; car.skippedPay = 0;
  list.slice().sort((a,b) => String(a.date).localeCompare(String(b.date))).forEach(p => {
    const usd = r2(N(p.amount_usd != null ? p.amount_usd : p.amount));
    const take = r2(Math.min(usd, room)); room = r2(room - take);
    if(take > 0) car.oldPayments.push({id:'old_p' + p.id, stage:'buy', amount:take, date:p.date || String(p.created_at || '').slice(0,10),
      method:OI_METHOD[p.method] || 'أخرى',
      note:[p.ref, p.receipt_notes, p.currency && p.currency !== 'USD' ? `${p.amount} ${p.currency} بسعر ${p.rate}` : ''].filter(Boolean).join(' · ')});
    car.skippedPay = r2(car.skippedPay + usd - take);
  });
}

/* the old program kept each car's photos in tracking/{VIN}.images (readable without signing in) */
async function oldPhotos(vins){
  if(!oldApp) oldApp = firebase.initializeApp(OLD_CFG, 'old');
  const ofs = oldApp.firestore(), res = {};
  await Promise.all([...new Set(vins.filter(Boolean))].map(async vin => {
    try{
      const d = await ofs.collection('tracking').doc(vin).get();
      const imgs = d.exists ? (d.data().images || []) : [];
      const order = s => s === 'auction' ? 0 : 1;
      const list = imgs.filter(x => x && x.src).sort((a,b) => order(a.stage) - order(b.stage) || String(a.at).localeCompare(String(b.at))).map(x => x.src);
      if(list.length) res[vin] = [...new Set(list)];
    }catch(e){}
  }));
  return res;
}
function applyOldPhotos(c, list){
  if(!list || !list.length) return;
  const own = c.img && !(c.photos || []).includes(c.img) && !list.includes(c.img);   // a photo picked by hand here wins
  c.photos = list;
  if(!own) c.img = list[0];
}
async function syncOldPhotos(){
  const map = await oldPhotos(db.cars.map(c => c.vin));
  let n = 0;
  for(const c of db.cars){ if(map[c.vin]){ applyOldPhotos(c, map[c.vin]); save(c); n++; } }
  render(); return n;
}
async function oldImportRun(){
  if(!oldPlan) return;
  $('#oiBtns').innerHTML = '<span class="muted">جاري الاستيراد…</span>';
  const ops = [];
  oldPlan.custs.forEach(cu => { delete cu._new; db.customers.push(cu); ops.push(b => b.set(fs.collection('customers').doc(cu.id), plain(cu))); });
  oldPlan.cars.forEach(n => {
    let c = getCar(n.id);
    const oldPays = n.oldPayments || []; delete n.oldPayments; delete n.skippedPay;
    if(c){ // keep what was added here (payments, refunds, photo, own expenses); refresh the rest
      const own = (c.expenses || []).filter(e => !String(e.id).startsWith('old_'));
      // keep changes made here to imported expenses (e.g. a fine moved onto the office)
      n.expenses.forEach(e => { const prev = (c.expenses || []).find(x => x.id === e.id); if(prev) Object.assign(e, {payer:prev.payer, kind:prev.kind, stage:prev.stage}); });
      const ownPays = (c.payments || []).filter(p => !String(p.id).startsWith('old_'));
      Object.assign(c, n, {expenses:own.concat(n.expenses), payments:oldPays.concat(ownPays), created:c.created, loc:Math.max(c.loc || 0, n.loc)});
    } else { c = Object.assign({stage:'buy', payments:oldPays, refunds:[], lock1:null, lock2:null, manualShip:false}, n); db.cars.push(c); }
    applyOldPhotos(c, n.photos);
    const hadLock = c.lock1; sync(c);
    // stage 1 closed by old payments: profit was received on the last payment's date, not today
    if(c.lock1 && !hadLock && oldPays.length && !c.payments.some(p => p.stage === 'buy' && !String(p.id).startsWith('old_')))
      c.lock1 = oldPays.map(p => p.date).filter(Boolean).sort().pop() || c.lock1; ops.push(b => b.set(fs.collection('cars').doc(c.id), plain(c)));
  });
  try{
    for(let i = 0; i < ops.length; i += 400){ const b = fs.batch(); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); }
    const n = oldPlan.cars.length; oldPlan = null; closeModal(); go('cars'); toast(`تم استيراد ${n} سيارة`);
    if(oldApp) oldApp.auth().signOut();
  }catch(e){ fbErr(e); $('#oiBtns').innerHTML = `<button class="btn pri" onclick="oldImportRun()">إعادة المحاولة</button>`; }
}

if(PUB && USE_FB){ firebase.initializeApp(FBC); fs = firebase.firestore(); renderPublic(); }
else {
  if(USE_FB) initFirebase();
  else setCloud('<span title="البيانات في هذا المتصفح فقط — عبّي firebase-config.js للربط">💾 محلي</span>');
  render();
}
